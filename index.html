<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab4Net · CCNA Lab Bench</title>
<style>
:root{
  --bg:#060a13; --panel:rgba(13,21,37,.82); --line:#1d2b47; --ink:#dce8ff; --muted:#8496ba;
  --cy:#35e0ff; --vi:#9a86ff; --up:#3dffa8; --down:#ff5a72; --am:#ffc65c; --term:#040811;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hud:"Oxanium","Barlow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;color:var(--ink);font:400 15px/1.5 var(--ui);display:flex;flex-direction:column;
  background:radial-gradient(ellipse 70% 50% at 12% -10%,rgba(53,224,255,.13),transparent 60%),radial-gradient(ellipse 60% 50% at 100% 110%,rgba(154,134,255,.15),transparent 60%),var(--bg)}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
::selection{background:rgba(53,224,255,.3)}
*{scrollbar-width:thin;scrollbar-color:#2a3d63 transparent}

header{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(6,10,19,.7);backdrop-filter:blur(10px);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cy) 20%,var(--vi) 80%,transparent);opacity:.7}
h1{display:flex;align-items:center;gap:10px;font:700 19px/1 var(--hud);letter-spacing:.04em;margin:0;white-space:nowrap}
h1 svg{width:26px;height:26px}
h1 .n{fill:var(--cy)} h1 .l{stroke:var(--cy);stroke-width:1.5;opacity:.6}
h1 .p{fill:var(--up);animation:beat 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.5}}
#labs{flex:0 1 360px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:#0b1424;color:var(--ink);font:500 15px var(--hud)}
#labs:hover{border-color:var(--cy)}
#meter{margin-left:auto;display:flex;align-items:center;gap:3px;white-space:nowrap}
#meter i{width:13px;height:7px;background:#16233c;transform:skewX(-22deg);transition:background .4s,box-shadow .4s}
#meter i.on{background:var(--up);box-shadow:0 0 9px var(--up)}
#meter span{font:600 13px var(--hud);color:var(--muted);margin-left:9px}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,410px) 1fr;gap:12px;padding:12px}
#brief{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px 20px;overflow-y:auto;backdrop-filter:blur(8px)}
#brief h2{font:700 23px/1.15 var(--hud);margin:0 0 8px;background:linear-gradient(90deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
#brief p{margin:0 0 12px;color:var(--muted)}
#brief h3{font:600 14px var(--hud);letter-spacing:.06em;color:var(--cy);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
#brief h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
#brief ol{margin:0;padding:0;list-style:none;counter-reset:t}
#brief ol>li{counter-increment:t;position:relative;padding-left:40px;margin-bottom:10px}
#brief ol>li::before{content:counter(t,decimal-leading-zero);position:absolute;left:0;top:1px;font:600 12px var(--hud);color:var(--cy);border:1px solid var(--line);background:#0b1424;padding:1px 6px;border-radius:2px}
code{font:500 12.5px var(--mono);background:rgba(53,224,255,.1);color:#b4f3ff;padding:1px 5px;border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{text-align:left;padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
th{font:600 12px var(--hud);color:var(--muted)}
td:last-child{font-family:var(--mono);font-size:12px;color:#b4f3ff}
details{margin-top:5px;font-size:14px;color:#cdbf9d;border-left:2px solid var(--am);padding-left:10px}
details[open]{animation:fade .3s}
summary{cursor:pointer;color:var(--am);font:600 13px var(--hud);width:max-content}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;background:#101b30;box-shadow:inset 0 0 0 1px var(--line);padding:8px 15px;font:600 14px var(--hud);letter-spacing:.03em;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:filter .15s,box-shadow .15s,transform .05s}
.btn:hover{box-shadow:inset 0 0 0 1px var(--cy);filter:brightness(1.25)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:0;box-shadow:inset 0 0 0 2px #fff}
.btn.primary{background:linear-gradient(90deg,var(--cy),var(--vi));color:#04101c;box-shadow:none}
#grade{margin-top:16px}
#grade ul{list-style:none;margin:8px 0 0;padding:0}
#grade li{padding-left:24px;position:relative;margin-bottom:5px;font-size:14px;animation:rise .35s both;animation-delay:calc(var(--i)*70ms)}
#grade li::before{position:absolute;left:0;font-weight:600}
#grade li.ok::before{content:"✓";color:var(--up);text-shadow:0 0 8px var(--up)}
#grade li.no::before{content:"✗";color:var(--down)}
#grade li.no{color:#ffb9c3}
#grade strong{display:block;font:600 16px var(--hud);padding:8px 12px;border:1px solid var(--line);background:#0b1424}
#grade strong.done{border-color:var(--up);color:#04140c;background:linear-gradient(100deg,var(--up) 0 40%,#d4ffe9 50%,var(--up) 60% 100%);background-size:250% 100%;animation:shimmer 1.6s ease-out}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
.sol{margin:0 0 9px}
.sol code{display:block;background:var(--term);border-left:2px solid var(--cy);color:var(--ink);padding:5px 9px;border-radius:0}
.sol span{display:block;font-size:13px;line-height:1.4;color:var(--muted);padding:3px 11px 0}
.big{font:500 27px var(--mono);margin:8px 0 14px;color:var(--cy);text-shadow:0 0 14px rgba(53,224,255,.5)}
.drill label{display:grid;grid-template-columns:140px 1fr 18px;gap:8px;align-items:center;margin-bottom:8px;font-size:14px}
.drill input{font:500 14px var(--mono);padding:7px 9px;border:1px solid var(--line);border-radius:3px;background:#0b1424;color:var(--ink);min-width:0}
.drill input:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px rgba(53,224,255,.15)}
.drill .ok{color:var(--up);font-weight:600}.drill .no{color:var(--down);font-weight:600}

#bench{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.hud{position:relative}
.hud::before,.hud::after{content:"";position:absolute;width:16px;height:16px;pointer-events:none;z-index:2}
.hud::before{top:0;left:0;border-top:2px solid var(--cy);border-left:2px solid var(--cy)}
.hud::after{bottom:0;right:0;border-bottom:2px solid var(--vi);border-right:2px solid var(--vi)}
#topo{flex:0 0 auto;border:1px solid var(--line);border-radius:4px;overflow:hidden;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(6,10,19,.9) 100%),linear-gradient(rgba(53,224,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(53,224,255,.07) 1px,transparent 1px),#08101e;
  background-size:auto,30px 30px,30px 30px,auto;animation:drift 24s linear infinite}
@keyframes drift{to{background-position:0 0,30px 30px,30px 30px,0 0}}
#topo svg{display:block;width:100%;height:auto;max-height:36vh}
.wire.base{stroke:rgba(53,224,255,.32);stroke-width:2}
.wire.flow{stroke:var(--cy);stroke-width:2;stroke-linecap:round;stroke-dasharray:2 14;animation:flow 1s linear infinite;filter:drop-shadow(0 0 3px var(--cy))}
@keyframes flow{to{stroke-dashoffset:-16}}
.wire.off{stroke:rgba(255,90,114,.5);stroke-width:1.5;stroke-dasharray:4 6}
.wire.flash{stroke:#fff;stroke-width:6;stroke-linecap:round;opacity:0;animation:flash 1s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.port{font:500 9px var(--mono);fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:#08101e;stroke-width:3px}
.led.on{fill:var(--up);filter:drop-shadow(0 0 4px var(--up))} .led.off{fill:var(--down)}
.dev{cursor:pointer;outline:none}
.dev .body{fill:#0c1830;stroke:var(--cy);stroke-width:1.7;transition:fill .2s}
.dev.switch .body{stroke:var(--vi)} .dev.pc .body,.dev.srv .body{stroke:#a9bce3}
.dev .glyph{stroke:var(--ink);stroke-width:1.4;fill:none}
.dev text{font:600 12px var(--hud);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:#08101e;stroke-width:3px}
.dev:hover .body{fill:#16294c}
.dev:focus-visible .body{stroke:#fff;stroke-width:2.6}
.dev.sel .body{fill:#12305a;filter:drop-shadow(0 0 7px var(--cy))}
.selring{fill:none;stroke:var(--cy);stroke-width:1.4;stroke-dasharray:7 9;transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.intro .pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*80ms);transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.intro .wire,.intro .led,.intro .port{animation:fade .7s both .35s}
.intro .wire.flow{animation:fade .7s both .35s,flow 1s linear infinite}
.pkt{filter:drop-shadow(0 0 7px currentColor)}
.pkt.req{fill:#fff;color:var(--cy)} .pkt.rep{fill:#fff;color:var(--up)}
.trail{stroke-width:4;stroke-linecap:round;animation:trail 1.3s ease-out forwards}
.trail.req{stroke:var(--cy)} .trail.rep{stroke:var(--up)}
@keyframes trail{from{opacity:.85}to{opacity:0}}
.burst{fill:none;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:burst 1s ease-out forwards}
.burst.hop{stroke:var(--cy);stroke-width:1.5;animation-duration:.55s}
.burst.good{stroke:var(--up)} .burst.bad{stroke:var(--down)} .burst.warn{stroke:var(--am)}
@keyframes burst{from{transform:scale(.35);opacity:1}to{transform:scale(1.7);opacity:0}}
.fxlabel{font:600 11.5px var(--hud);text-anchor:middle;paint-order:stroke;stroke:#060a13;stroke-width:4px;animation:label 3s ease-out forwards}
.fxlabel.good{fill:var(--up)} .fxlabel.bad{fill:var(--down)} .fxlabel.warn{fill:var(--am)}
@keyframes label{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}

#console{flex:1;min-height:260px;display:flex;flex-direction:column;background:var(--term);border:1px solid var(--line);border-radius:4px;overflow:hidden}
#console>.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(255,255,255,.022) 0 1px,transparent 1px 3px);z-index:1}
#tabs{display:flex;gap:2px;overflow-x:auto;background:#070d1a;padding:6px 8px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 13px;font:600 13px var(--hud);letter-spacing:.03em;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--cy);border-bottom-color:var(--cy);text-shadow:0 0 10px rgba(53,224,255,.7)}
#term{flex:1;min-height:0;overflow-y:auto;padding:12px 15px;font:400 13px/1.5 var(--mono);color:#b9c8e6;cursor:text}
#tout{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
#tout .cmd{color:#fff}
#tout .good{color:var(--up)} #tout .bad{color:var(--down)} #tout .warn{color:var(--am)}
#tout .new{animation:fade .22s both;animation-delay:calc(var(--i)*22ms)}
#inrow{display:flex}
#prompt{white-space:pre;color:var(--cy);text-shadow:0 0 8px rgba(53,224,255,.5)}
#tin{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:inherit;padding:0;caret-color:var(--cy)}
#hint{font:400 12.5px/1.4 var(--ui);color:var(--muted);padding:7px 15px 9px;border-top:1px solid var(--line);background:#070d1a}
#hint.why{color:var(--am);animation:slide .35s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}}

@media (max-width:860px){
  body{height:auto}
  header{flex-wrap:wrap;gap:8px}
  #labs{flex:1 1 100%;order:3}
  main{grid-template-columns:1fr}
  #console{height:400px;flex:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}}

#labs{flex:1 1 200px;max-width:300px;border-radius:8px;padding:9px 12px;font-size:13px;background:#152035}
.header-actions{display:flex;gap:8px}.small-btn{border:1px solid var(--line);background:#152035;border-radius:7px;padding:7px 11px;color:var(--ink);font-size:12px;min-height:36px}.small-btn:hover{border-color:var(--cy)}

.eyebrow span{color:var(--muted)}#brief h2{font-size:26px;line-height:1.2;letter-spacing:-.04em;background:none;color:var(--ink);margin-bottom:12px}

details{color:#d2c5a9;border-left:0;padding-left:0;font-size:12px;line-height:1.65}summary{font-size:11px;padding:6px 0;min-height:32px;max-width:100%;width:auto}.addressing{margin:18px 0}.addressing summary{color:var(--ink);font-weight:600;font-size:12px}.table-wrap{overflow-x:auto}table{font-size:11px}th{font-size:10px}td{padding:6px 6px 6px 0}td:last-child{font-size:10px}
#brief ol>li{padding:0;display:flex;gap:10px;margin:0;padding:13px 0;border-bottom:1px solid #25344b}#brief ol>li::before{display:none}.tasks>li>div{flex:1;min-width:0;font-size:13px;line-height:1.6}.task-check{position:relative;display:flex;align-items:flex-start;cursor:pointer;flex:0 0 32px;min-height:32px}.task-check input{position:absolute;opacity:0;width:32px;height:32px;margin:0}.task-check span{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:#192b40;border:1px solid #334960;font:600 10px var(--mono);color:var(--cy)}.task-check input:focus-visible+span{outline:2px solid var(--cy);outline-offset:3px}.task-check input:checked+span{background:#183e37;color:var(--up);border-color:var(--up)}.checked>div{color:#b1c4cf}

#trace:empty{display:none}#trace{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;background:#0d1928}.trace-title{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;font-weight:600}.trace-title .small-btn{font-weight:400;flex:none}.trace-path{margin-top:6px;color:var(--muted);font-family:var(--mono);font-size:11px;overflow-wrap:anywhere}.trace-path b{font-family:var(--ui);margin-right:6px;color:var(--ink)}#trace p{margin:8px 0 0;font-size:11px;color:var(--muted)}.good{color:var(--up)}.bad{color:var(--down)}

<script>
//ENGINE-START
const ip2n=s=>{const p=String(s).split('.');if(p.length!==4)return null;let n=0;for(const x of p){if(!/^\d+$/.test(x)||+x>255)return null;n=n*256+ +x;}return n;};
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const isIp=s=>ip2n(s)!==null;
const lenMask=l=>l===0?0:((0xFFFFFFFF<<(32-l))>>>0);
const maskLenN=n=>{for(let l=0;l<=32;l++)if(lenMask(l)===n)return l;return null;};
const netOf=(ip,len)=>(ip&lenMask(len))>>>0;
const IFT=['FastEthernet','GigabitEthernet','Loopback','Vlan'];
function parseIf(str){const m=/^([a-z]+)([\d\/.]+)$/i.exec(String(str).replace(/\s+/g,''));if(!m)return null;const t=IFT.find(t=>t.toLowerCase().startsWith(m[1].toLowerCase()));return t?t+m[2]:null;}
const shortIf=n=>n.replace('FastEthernet','Fa').replace('GigabitEthernet','Gi').replace('Loopback','Lo').replace('Vlan','Vl').replace('Port-channel','Po');
function sortIfs(names){const key=n=>{const t=IFT.findIndex(t=>n.startsWith(t));return [t].concat((n.match(/\d+/g)||[]).map(Number));};
  return names.slice().sort((a,b)=>{const x=key(a),y=key(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]??-1)-(y[i]??-1);if(d)return d;}return 0;});}
const pad=(s,n)=>String(s).padEnd(n);

function addIf(d,n,o){d.ifs[n]=Object.assign({name:n,ip:null,len:null,shutdown:false,desc:'',link:null,mode:'access',modeSet:false,accessVlan:1,native:1,allowed:'all',dot1q:null},o||{});return d.ifs[n];}
function mkRouter(name){const d={name,type:'router',hostname:name,ifs:{},statics:[],ospf:null,lines:{con:{},vty:{}}};['0/0','0/1','0/2'].forEach(x=>addIf(d,'GigabitEthernet'+x,{shutdown:true}));return d;}
function mkSwitch(name){const d={name,type:'switch',hostname:name,ifs:{},vlans:{1:{name:'default'}},gw:null,lines:{con:{},vty:{}}};
  for(let i=1;i<=8;i++)addIf(d,'FastEthernet0/'+i);addIf(d,'GigabitEthernet0/1');addIf(d,'GigabitEthernet0/2');addIf(d,'Vlan1',{shutdown:true});return d;}
function mkPC(name,ip,len,gw){const d={name,type:'pc',hostname:name,ifs:{},gw:gw?ip2n(gw):null};addIf(d,'FastEthernet0',{ip:ip2n(ip),len});return d;}
function mkNet(devs){const net={devs:{},links:[]};devs.forEach(d=>net.devs[d.name]=d);return net;}
function link(net,a,ai,b,bi){ai=parseIf(ai);bi=parseIf(bi);net.devs[a].ifs[ai].link={dev:b,ifn:bi};net.devs[b].ifs[bi].link={dev:a,ifn:ai};net.links.push({a,ai,b,bi});}
function setIp(net,dev,ifn,ip,len){const i=net.devs[dev].ifs[parseIf(ifn)];i.ip=ip2n(ip);i.len=len;i.shutdown=false;}

const allowed=(p,v)=>p.allowed==='all'||p.allowed.includes(v);
const phys=(d,i)=>i.name.includes('.')?d.ifs[i.name.split('.')[0]]:i;
function ifUp(net,d,i){
  if(i.shutdown)return false;
  if(i.name.startsWith('Loopback'))return true;
  if(i.name.startsWith('Vlan')){const v=+i.name.slice(4);if(!d.vlans[v])return false;
    return Object.values(d.ifs).some(p=>p.link&&!p.name.startsWith('Vlan')&&ifUp(net,d,p)&&(p.mode==='trunk'?allowed(p,v):p.accessVlan===v));}
  const p=phys(d,i);if(p.shutdown||!p.link)return false;
  return !net.devs[p.link.dev].ifs[p.link.ifn].shutdown;
}
function l2peers(net,d,i){
  const out=[];if(i.name.startsWith('Loopback')||!ifUp(net,d,i))return out;
  const seen=new Set();
  function flood(sw,vlan,inPort,path){
    const k=sw.name+'|'+vlan;if(seen.has(k))return;seen.add(k);
    if(!sw.vlans[vlan])return;
    const svi=sw.ifs['Vlan'+vlan];if(svi&&svi!==i&&!svi.shutdown&&svi.ip!==null)out.push({dev:sw,ifc:svi,path});
    for(const p of Object.values(sw.ifs)){
      if(p===inPort||!p.link||p.name.startsWith('Vlan')||!ifUp(net,sw,p))continue;
      let tag=null;
      if(p.mode==='trunk'){if(!allowed(p,vlan))continue;tag=vlan===p.native?null:vlan;}
      else if(p.accessVlan!==vlan)continue;
      deliver(net.devs[p.link.dev],p.link.ifn,tag,path);
    }
  }
  function deliver(dev,ifn,tag,previous){
    const path=previous.concat(dev.name);
    const port=dev.ifs[ifn];
    if(dev.type==='switch'){
      let vlan;
      if(port.mode==='trunk'){vlan=tag===null?port.native:tag;if(!allowed(port,vlan))return;}
      else{if(tag!==null&&tag!==port.accessVlan)return;vlan=port.accessVlan;}
      flood(dev,vlan,port,path);
    }else if(tag===null){if(port.ip!==null&&port!==i)out.push({dev,ifc:port,path});}
    else for(const s of Object.values(dev.ifs))if(s.name.startsWith(ifn+'.')&&s.dot1q===tag&&!s.shutdown&&s!==i)out.push({dev,ifc:s,path});
  }
  if(d.type==='switch')flood(d,+i.name.slice(4),null,[d.name]);
  else{const p=phys(d,i);const tag=p===i?null:i.dot1q;if(p!==i&&tag==null)return out;deliver(net.devs[p.link.dev],p.link.ifn,tag,[d.name]);}
  return out;
}
function connected(net,d){const r=[];for(const i of Object.values(d.ifs))if(i.ip!==null&&ifUp(net,d,i))r.push({code:'C',net:netOf(i.ip,i.len),len:i.len,ifc:i,nh:null,ad:0});return r;}
function ospfIfs(net,d){if(!d.ospf)return [];const r=[];for(const i of Object.values(d.ifs)){if(i.ip===null||!ifUp(net,d,i))continue;
  const n=d.ospf.networks.find(n=>((i.ip&~n.wild)>>>0)===((n.net&~n.wild)>>>0));if(n)r.push({ifc:i,area:n.area});}return r;}
function ospfNeighbors(net,d){const res=[];for(const o of ospfIfs(net,d)){if(d.ospf.passive.includes(o.ifc.name))continue;
  for(const p of l2peers(net,d,o.ifc)){const pd=p.dev;if(pd.type!=='router'||!pd.ospf)continue;
    const po=ospfIfs(net,pd).find(x=>x.ifc===p.ifc);if(!po||po.area!==o.area||pd.ospf.passive.includes(p.ifc.name))continue;
    if(p.ifc.len!==o.ifc.len||netOf(p.ifc.ip,p.ifc.len)!==netOf(o.ifc.ip,o.ifc.len))continue;
    res.push({dev:pd,ifc:o.ifc,pifc:p.ifc});}}return res;}
function routerId(d){if(d.ospf&&d.ospf.rid!=null)return d.ospf.rid;const all=Object.values(d.ifs).filter(i=>i.ip!==null);const lo=all.filter(i=>i.name.startsWith('Loopback'));const s=(lo.length?lo:all).map(i=>i.ip);return s.length?Math.max(...s):0;}
function ospfRoutes(net,d){if(!d.ospf)return [];
  const dist=new Map([[d.name,{cost:0,first:null}]]),q=[d];
  while(q.length){const u=q.shift(),du=dist.get(u.name);for(const nb of ospfNeighbors(net,u)){if(dist.has(nb.dev.name))continue;dist.set(nb.dev.name,{cost:du.cost+1,first:du.first||{ifc:nb.ifc,nh:nb.pifc.ip}});q.push(nb.dev);}}
  const own=new Set(connected(net,d).map(c=>c.net+'/'+c.len)),out=[];
  for(const [name,info] of dist){if(name===d.name)continue;for(const o of ospfIfs(net,net.devs[name])){const nn=netOf(o.ifc.ip,o.ifc.len),k=nn+'/'+o.ifc.len;
    if(own.has(k)||out.some(x=>x.key===k))continue;out.push({key:k,code:'O',net:nn,len:o.ifc.len,ifc:info.first.ifc,nh:info.first.nh,ad:110,metric:info.cost+1});}}
  return out;}
function routes(net,d){let r=connected(net,d);
  if(d.type==='router'){for(const s of d.statics)if(r.some(c=>c.code==='C'&&netOf(s.nh,c.len)===c.net))r.push({code:'S',net:s.net,len:s.len,nh:s.nh,ad:1});
    r=r.concat(ospfRoutes(net,d).filter(o=>!r.some(x=>x.net===o.net&&x.len===o.len)));}
  else if(d.gw!=null)r.push({code:'S',net:0,len:0,nh:d.gw,ad:1});
  return r;}
function nextHop(net,d,dst){const rt=routes(net,d);let best=null;
  for(const r of rt)if(netOf(dst,r.len)===r.net&&(!best||r.len>best.len||(r.len===best.len&&r.ad<best.ad)))best=r;
  if(!best)return null;let ifc=best.ifc;const nh=best.nh==null?dst:best.nh;
  if(!ifc){const c=rt.find(c=>c.code==='C'&&netOf(nh,c.len)===c.net);if(!c)return null;ifc=c.ifc;}
  return {ifc,nh};}
const ownsIp=(net,d,ip)=>Object.values(d.ifs).some(i=>i.ip===ip&&ifUp(net,d,i));
function tracePath(net,src,dst){let d=src,hops=[],srcIp=null;
  for(let t=0;t<20;t++){
    if(ownsIp(net,d,dst))return {ok:true,hops,srcIp,dest:d};
    if(t>0&&d.type!=='router')return {ok:false,hops};
    const h=nextHop(net,d,dst);if(!h)return {ok:false,hops};
    if(t===0)srcIp=h.ifc.ip;
    const peer=l2peers(net,d,h.ifc).find(p=>p.ifc.ip===h.nh);if(!peer)return {ok:false,hops};
    hops.push(h.nh);d=peer.dev;}
  return {ok:false,hops};}
function canPing(net,src,dst){const f=tracePath(net,src,dst);if(!f.ok)return false;if(f.srcIp===null)return true;return tracePath(net,f.dest,f.srcIp).ok;}

function parseVlanList(s){const r=[];for(const part of s.split(',')){const m=/^(\d+)(?:-(\d+))?$/.exec(part.trim());if(!m)return null;const a=+m[1],b=m[2]?+m[2]:a;for(let v=a;v<=b&&v<4095;v++)r.push(v);}return r;}
function runningConfig(net,d){
  const L=['Building configuration...','','Current configuration:','!','version 15.2',(d.svcEnc?'':'no ')+'service password-encryption','!','hostname '+d.hostname,'!'];
  if(d.secret)L.push('enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0');
  if(d.enPass)L.push('enable password '+d.enPass);
  if(d.noLookup)L.push('no ip domain-lookup');
  L.push('!');
  for(const n of sortIfs(Object.keys(d.ifs))){const i=d.ifs[n];L.push('interface '+n);
    if(i.desc)L.push(' description '+i.desc);
    if(i.dot1q!=null)L.push(' encapsulation dot1Q '+i.dot1q);
    if(d.type==='switch'&&!n.startsWith('Vlan')){
      if(i.accessVlan!==1)L.push(' switchport access vlan '+i.accessVlan);
      if(i.allowed!=='all')L.push(' switchport trunk allowed vlan '+i.allowed.join(','));
      if(i.native!==1)L.push(' switchport trunk native vlan '+i.native);
      if(i.modeSet)L.push(' switchport mode '+i.mode);
    }else L.push(i.ip!==null?' ip address '+n2ip(i.ip)+' '+n2ip(lenMask(i.len)):' no ip address');
    if(i.shutdown)L.push(' shutdown');L.push('!');}
  if(d.ospf){L.push('router ospf '+d.ospf.pid);if(d.ospf.rid!=null)L.push(' router-id '+n2ip(d.ospf.rid));
    d.ospf.passive.forEach(p=>L.push(' passive-interface '+p));
    d.ospf.networks.forEach(n=>L.push(' network '+n2ip(n.net)+' '+n2ip(n.wild)+' area '+n.area));L.push('!');}
  if(d.type==='switch'&&d.gw!=null)L.push('ip default-gateway '+n2ip(d.gw));
  (d.statics||[]).forEach(s=>L.push('ip route '+n2ip(s.net)+' '+n2ip(lenMask(s.len))+' '+n2ip(s.nh)));
  if(d.banner)L.push('!','banner motd ^C'+d.banner+'^C');
  L.push('!');
  [['con','line con 0'],['vty','line vty 0 4']].forEach(([k,h])=>{L.push(h);const l=d.lines[k];if(l.password)L.push(' password '+l.password);if(l.login)L.push(' login');if(l.transport)L.push(' transport input '+l.transport);});
  L.push('!','end');return L;}

const CMDS=[];
const C=(modes,pat,fn,types)=>CMDS.push({modes:modes.split(','),pat:pat.split(' '),fn,types});
const EX='user,priv',ALLCFG='config,if,vlan,line,ospf',BAD="% Invalid input detected at '^' marker.";
C('user','enable',e=>{e.s.mode='priv';});
C('priv','disable',e=>{e.s.mode='user';});

function matchPat(pat,toks){const args=[];let i=0;
  for(const p of pat){
    if(p==='<rest>'){if(i>=toks.length)return 'partial';args.push(toks.slice(i).join(' '));return {args};}
    if(p==='<rest?>'){args.push(toks.slice(i).join(' '));return {args};}
    if(i>=toks.length)return 'partial';
    const t=toks[i];
    if(p==='<ip>'){if(!isIp(t))return null;args.push(ip2n(t));}
    else if(p==='<n>'){if(!/^\d+$/.test(t))return null;args.push(+t);}
    else if(p==='<w>')args.push(t);
    else if(!p.startsWith(t.toLowerCase()))return null;
    i++;}
  return i===toks.length?{args}:null;}
function run(env,line,mode){line=line.trim();if(!line)return;const toks=line.split(/\s+/),{d,s}=env;let partial=false;
  const find=m=>{for(const c of CMDS){if(!c.modes.includes(m)||(c.types&&!c.types.includes(d.type)))continue;const r=matchPat(c.pat,toks);if(r==='partial')partial=true;else if(r)return {c,args:r.args};}return null;};
  let m=find(mode);
  if(!m&&!['config','user','priv','pc'].includes(mode)){m=find('config');if(m){s.mode='config';s.ctx=null;}}
  if(m){env.args=m.args;m.c.fn(env);return;}
  env.out(partial?'% Incomplete command.':BAD);}
function execLine(net,d,s,line){const out=[];const env={net,d,s,out:(...x)=>out.push(...x)};
  const snap=()=>{const m={};for(const n in d.ifs)m[n]=ifUp(net,d,d.ifs[n]);return m;};
  const before=d.type==='pc'?null:snap();
  run(env,line,s.mode);
  if(before){const after=snap();for(const n in after)if(!!before[n]!==after[n]){const st=after[n]?'up':'down';out.push('%LINK-3-UPDOWN: Interface '+n+', changed state to '+st,'%LINEPROTO-5-UPDOWN: Line protocol on Interface '+n+', changed state to '+st);}}
  return out;}
function promptOf(d,s){const h=d.hostname;switch(s.mode){case 'pc':return 'C:\\>';case 'user':return h+'>';case 'priv':return h+'#';case 'config':return h+'(config)#';
  case 'if':return h+(s.ctx.length>1?'(config-if-range)#':s.ctx[0].name.includes('.')?'(config-subif)#':'(config-if)#');case 'vlan':return h+'(config-vlan)#';case 'line':return h+'(config-line)#';default:return h+'(config-router)#';}}
const HELP={'<ip>':'A.B.C.D','<n>':'<number>','<w>':'WORD','<rest>':'LINE','<rest?>':'<cr>'};
function candidates(d,mode,line){const sp=line===''||/\s$/.test(line);const toks=line.trim()?line.trim().split(/\s+/):[];const part=sp?'':toks.pop().toLowerCase();const set=new Set();
  for(const c of CMDS){if(!c.modes.includes(mode)||(c.types&&!c.types.includes(d.type)))continue;const pat=c.pat;let ok=true,rest=false;
    for(let j=0;j<toks.length;j++){const p=pat[j];if(p===undefined){ok=false;break;}if(p.startsWith('<rest')){rest=true;break;}if(p[0]==='<')continue;if(!p.startsWith(toks[j].toLowerCase())){ok=false;break;}}
    if(!ok)continue;if(rest){set.add('LINE');continue;}
    const p=pat[toks.length];if(p===undefined){if(!part)set.add('<cr>');continue;}
    if(p[0]==='<')set.add(HELP[p]);else if(p.startsWith(part))set.add(p);}
  return [...set];}

'access-list <n> <w> <rest>':'Adds a line to a numbered ACL (1-99 standard, 100-199 extended). Lines are read top-down, the first match wins, and anything unmatched hits the invisible deny at the end.',
'ip access-list <w> <w>':'Creates or edits a named ACL. Names are easier to read and let you edit individual lines.',

'deny <rest>':'An ACL entry. Order matters: put specific lines first, because the first match decides.',
'ip access-group <w> <w>':'An ACL does nothing until it is applied to an interface in a direction. Standard ACLs go close to the destination; extended ACLs go close to the source.',

'ip nat inside source list <w> interface <rest>':'PAT: any inside source the ACL permits is translated to this interface address. overload lets many hosts share it by tracking port numbers.',

'network <ip> <ip>':'Defines the subnet the pool leases from. The router matches a request to a pool by the interface (or relay) it came in on.',

function whyOf(cmd){const t=cmd.trim().split(/\s+/);for(const c of CMDS){const r=matchPat(c.pat,t);if(r&&r!=='partial'){const w=WHYC[c.pat.join(' ')];if(w)return w;}}return '';}

// ---------- explanations for labs 1-6 ----------
LABS[0].group='Fundamentals';LABS[1].group=LABS[2].group='Switching';LABS[3].group=LABS[4].group=LABS[5].group='Routing';
LABS[0].why=['A unique name tells you which console you are in, and it shows up in logs and in the SSH key name.','Privileged mode can change anything. enable secret stores a hash; enable password would sit in the config in clear text.','Anyone with physical access can plug into the console. The password does nothing until login tells the line to ask for it.','VTY lines are where remote sessions arrive. They need their own password and login before remote access is both possible and protected.','By default a mistyped word is treated as a hostname and the router stalls trying to resolve it.','The banner is the legal notice that access is restricted, which matters if misuse is ever investigated.','This address is the default gateway for the LAN. Router ports are shut down from the factory, so nothing passes until no shutdown.','Everything so far lives in RAM. A reload or power cut without saving puts you back to defaults.','A Layer 2 switch only needs an IP for management. It goes on the VLAN 1 interface, and the gateway lets the switch answer from other subnets.','Always verify. A ping from a host proves Layers 1 to 3 work end to end, not just that the config looks right.'];
LABS[1].why=['VLANs split one switch into separate broadcast domains, so departments do not see each other\'s broadcasts and can be secured separately. Names make the table readable.','An access port belongs to exactly one VLAN and sends untagged frames, which is what a PC expects. Setting the mode by hand stops the port negotiating a trunk.','Same reason, second VLAN. The port assignment is what actually separates the hosts.','show vlan brief is the fastest way to confirm ports landed in the VLAN you intended.','Same-VLAN hosts share a broadcast domain and can ARP for each other. Different VLANs cannot talk without a router, even on the same switch.'];
LABS[2].why=['VLANs are local to each switch. VLAN 10 must exist on both switches for its frames to be carried end to end.','Hosts only join a VLAN through their access port assignment.','A trunk tags each frame with its VLAN ID (802.1Q) so one cable can carry many VLANs between switches.','Trunks allow every VLAN by default. Pruning to the ones in use limits broadcasts and stops unused VLANs leaking across.','show interfaces trunk confirms the mode and the allowed list; the pings confirm frames keep their VLAN across the link.'];
LABS[3].why=['The router link must carry both VLANs, so it has to be a trunk on the switch side.','Subinterfaces follow the physical port. If the parent is shut down, all of them are down.','Each subinterface is the default gateway for one VLAN. The encapsulation line says which tag belongs to it, and IOS refuses an IP address until that is set.','One subinterface per VLAN: the router now has a connected route to each and can route between them.','Two connected routes, one per VLAN, are all the router needs. The ping crosses VLANs by going up the trunk and back down.'];
LABS[4].why=['A router only knows its connected networks. R1 has to be told about every remote network it must reach, including the transit link.','R2 sits in the middle and has to know both LANs. Routing is needed in both directions: a ping fails if the reply has no route back.','R3 is a stub with one way out, so a single default route replaces a list of specific ones.','Read the table before testing. S marks static routes and S* the default.','tracert shows each hop, which tells you exactly where a path breaks when a ping fails.'];
LABS[5].why=['A fixed router ID makes neighbor tables readable and avoids the ID changing when interfaces change.','The network command picks which interfaces run OSPF. All routers must agree on the area to become neighbors.','The LAN still gets advertised, but no hellos are sent toward hosts, where no neighbor could ever form.','FULL means adjacency is complete. O routes in the table are the networks learned from neighbors.','End-to-end pings confirm every router learned every LAN dynamically, with no static routes.'];

 addr:[['SW1','Should be root','MAC 0019.e8a2.3c00'],['SW2','Should be backup root','MAC 0019.e8a2.2b00'],['SW3','Oldest switch','MAC 000d.bd11.0a00']],
 tasks:['Run <code>show spanning-tree</code> on each switch and work out which one is root and which port is blocking.','Switch all three to Rapid PVST+.','Make SW1 the primary root for VLAN 1.','Make SW2 the secondary root for VLAN 1.','On the host ports (SW1 Fa0/1 and SW3 Fa0/1), enable PortFast and BPDU Guard.','Run <code>show spanning-tree</code> again and find the blocked port.'],

const bcOf=q=>(netOf(q.ip,q.len)|~lenMask(q.len))>>>0;
const DF=[['Network address',q=>n2ip(netOf(q.ip,q.len))],['Broadcast address',q=>n2ip(bcOf(q))],['First usable host',q=>n2ip(netOf(q.ip,q.len)+1)],['Last usable host',q=>n2ip(bcOf(q)-1)],['Subnet mask',q=>n2ip(lenMask(q.len))],['Usable hosts',q=>String(2**(32-q.len)-2)]];
function newDrill(){const range=$('drillLevel')?.value||cur.drillLevel||'all';cur.drillLevel=range;const len=range==='starter'?[24,25,26][Math.floor(Math.random()*3)]:range==='links'?[27,28,29,30][Math.floor(Math.random()*4)]:8+Math.floor(Math.random()*23);let a=1+Math.floor(Math.random()*223);if(a===127)a=172;cur.drillQ={ip:(a*16777216+Math.floor(Math.random()*16777216))>>>0,len,done:null};}
function drillWhy(q){const m=lenMask(q.len),mask=n2ip(m);if(q.len%8===0)return `/${q.len} = ${mask}. The first ${q.len/8} octets are network bits. Set all host bits to 0 for the network and to 1 for the broadcast. The usable hosts sit between them.`;const k=Math.floor(q.len/8),sh=24-8*k,oct=(m>>>sh)&255,blk=256-oct,val=(q.ip>>>sh)&255,start=Math.floor(val/blk)*blk;return `/${q.len} = ${mask}. In octet ${k+1}, block size = 256 − ${oct} = ${blk}. ${val} lies in the block starting at ${start}. Set later octets to 0 for the network. The broadcast is one address below the next block. Usable hosts = 2^${32-q.len} − 2 = ${2**(32-q.len)-2}.`;}
function renderDrill(){const q=cur.drillQ,s=progress.drill||{r:0,t:0};$('brief').innerHTML=`<div class="eyebrow">Practice · IPv4</div><h2>Subnetting, one block at a time.</h2><p>Predict the network boundaries before you calculate the hosts.</p><div class="lesson-tip"><b>The block method</b><br>1. Convert the prefix to a mask.<br>2. Subtract the interesting mask octet from 256.<br>3. Find the block containing the given address.<br>4. Network = block start; broadcast = next block − 1.</div><h3>Your practice</h3><p>${s.r} / ${s.t} fields correct on first attempts.</p><p>These drills use /8 through /30 networks. /31 point-to-point links and /32 host routes use different host rules.</p>`;
  let h=`<div class="eyebrow">SUBNETTING WORKSPACE</div><label>Prefix range <select id="drillLevel"><option value="all">Mixed /8–/30</option><option value="starter">Warm-up /24–/26</option><option value="links">Small networks /27–/30</option></select></label><div class="big">${n2ip(q.ip)}/${q.len}</div><div class="drill">`;

  $('dCheck').onclick=()=>{const first=!q.done;q.done=DF.map(([,f],k)=>{const v=$('d'+k).value.trim();return {v,ok:v===f(q)};});if(first){s.t+=DF.length;s.r+=q.done.filter(x=>x.ok).length;progress.drill=s;persist();}renderDrill();};$('dNext').onclick=()=>{newDrill();renderDrill();};}

function drawTopo(){if(cur.view!=='lab')return;const{lab,net}=cur;let h=`<svg viewBox="0 0 600 245" class="${cur.intro?'intro':''}" role="group" aria-label="Interactive lab topology">`;cur.intro=false;

  for(const l of net.links){const k=pk(l),idx=seen[k]=(seen[k]??-1)+1,off=(idx-(cnt[k]-1)/2)*16;
    let[ax,ay]=lab.pos[l.a],[bx,by]=lab.pos[l.b];const A=net.devs[l.a],B=net.devs[l.b],up=ifUp(net,A,A.ifs[l.ai])&&ifUp(net,B,B.ifs[l.bi]);
    const id=l.a+'|'+l.ai,was=cur.links[id];cur.links[id]=up;
    const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,side=cnt[k]>1?(off<0?-1:1):1,px=-uy*10*side,py=ux*10*side;
    ax+=-uy*off;ay+=ux*off;bx+=-uy*off;by+=ux*off;const xy=`x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"`;
    h+=`<line class="wire ${up?'base':'off'}" ${xy}/>`;if(up)h+=`<line class="wire flow" ${xy}/>`;if(up&&was===false)h+=`<line class="wire flash" ${xy}/>`;
    [[A,l.ai,ax+ux*42,ay+uy*42,1],[B,l.bi,bx-ux*42,by-uy*42,-1]].forEach(([D,ifn,x,y,s])=>{
      h+=`<circle class="led ${up?'on':'off'}" cx="${x-ux*11*s}" cy="${y-uy*11*s}" r="3"/>`;
      if(D.type!=='pc')h+=`<text class="port" x="${x+px}" y="${y+py+3}">${shortIf(ifn)}</text>`;});}
  Object.keys(net.devs).forEach((n,k)=>{const d=net.devs[n],[x,y]=lab.pos[n],kind=d.type==='pc'?(d.services?'srv':'pc'):d.type;let g;

const fxLayer=()=>document.querySelector('#topo #fx');
function burst(name,cls,label){const g=fxLayer();if(!g)return;const[x,y]=cur.lab.pos[name];
  g.insertAdjacentHTML('beforeend',`<circle class="burst ${cls}" cx="${x}" cy="${y}" r="${cls==='hop'?24:30}"/>`+(label?`<text class="fxlabel ${cls}" x="${Math.min(520,Math.max(80,x))}" y="${y<60?y+56:y-36}">${label}</text>`:''));}
function fly(names,cls,tok){return new Promise(res=>{const g=fxLayer();if(!g||names.length<2||REDUCED)return res();
  const pts=names.map(n=>cur.lab.pos[n]),dot=document.createElementNS(NS,'circle');dot.setAttribute('r',4.5);dot.setAttribute('class','pkt '+cls);dot.setAttribute('cx',pts[0][0]);dot.setAttribute('cy',pts[0][1]);g.appendChild(dot);
  let seg=0,t0=null;const step=ts=>{if(tok!==fxToken||!dot.isConnected){dot.remove();return res();}if(t0===null)t0=ts;const a=pts[seg],b=pts[seg+1],dur=Math.max(200,Math.hypot(b[0]-a[0],b[1]-a[1])*2.4),k=Math.min(1,(ts-t0)/dur);
    dot.setAttribute('cx',a[0]+(b[0]-a[0])*k);dot.setAttribute('cy',a[1]+(b[1]-a[1])*k);
    if(k>=1){g.insertAdjacentHTML('afterbegin',`<line class="trail ${cls}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`);seg++;t0=null;
      if(seg>=pts.length-1){dot.remove();return res();}burst(names[seg],'hop');}
    requestAnimationFrame(step);};requestAnimationFrame(step);});}
async function playTrace(T){const tok=++fxToken,g=fxLayer();if(!g)return;g.innerHTML='';
  const fp=T.f.hops.path,end=fp[fp.length-1];await fly(fp,'req',tok);if(tok!==fxToken)return;
  if(!T.f.ok)return burst(end,'bad',T.f.blocked?'Blocked by ACL':'No path from here');
  if(T.refused)return burst(end,'warn','Port closed');
  if(!T.r)return burst(end,'good','');
  const rp=T.r.hops.path,e2=rp[rp.length-1];await fly(rp,'rep',tok);if(tok!==fxToken)return;
  if(T.ok)burst(e2,'good','Reply received');else burst(e2,'bad',T.r.blocked?'Reply blocked by ACL':'Reply has no route back');}
function celebrate(){if(REDUCED)return;const tok=fxToken;Object.keys(cur.net.devs).forEach((n,k)=>setTimeout(()=>{if(tok===fxToken)burst(n,'good','');},k*120));}


$('labs').onchange=e=>{if(['drill','quiz'].includes(e.target.value))openPractice(e.target.value);else openLab(+e.target.value);};
$('library').onclick=library;$('help').onclick=help;$('transfer').onclick=transfer;$('reference').onclick=reference;
$('missionView').onclick=()=>mobilePanel(false);$('networkView').onclick=()=>mobilePanel(true);window.addEventListener('resize',()=>{if(cur?.view==='lab')$('term').scrollTop=$('term').scrollHeight;});
$('closeDialog').onclick=()=>$('dialog').close();$('dialog').onclick=e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close();}};
$('tabs').onclick=e=>{const b=e.target.closest('[data-dev]');if(b)select(b.dataset.dev);};
$('tabs').onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const names=Object.keys(cur.net.devs),i=names.indexOf(cur.sel);const next=e.key==='Home'?0:e.key==='End'?names.length-1:(i+(e.key==='ArrowRight'?1:-1)+names.length)%names.length;select(names[next]);$('tab-'+names[next]).focus();}};
$('topo').onclick=e=>{const g=e.target.closest('[data-dev]');if(g)select(g.dataset.dev);};$('topo').onkeydown=e=>{const g=e.target.closest('[data-dev]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(g.dataset.dev);}};
$('clearConsole').onclick=()=>{cur.sess[cur.sel].lines=[];renderTerm();};$('term').onclick=()=>{if(!String(window.getSelection()))$('tin').focus({preventScroll:true});};
const tin=$('tin');tin.oninput=()=>{if(!tin.value.includes('?'))return;const{net,sess,sel}=cur,s=sess[sel],d=net.devs[sel],line=tin.value.replace(/\?/g,'');const c=candidates(d,s.mode,line);push(s,['\u0001'+promptOf(d,s)+line+'?',...(c.length?c.map(x=>'  '+x):['% Unrecognized command'])]);tin.value=line;renderTerm();};
tin.onkeydown=e=>{const s=cur.sess[cur.sel],d=cur.net.devs[cur.sel];if(e.key==='Enter'){e.preventDefault();const line=tin.value;tin.value='';execute(line);}else if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();if(d.type!=='pc'&&!['user','priv'].includes(s.mode))execute('end');}else if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();s.lines=[];renderTerm();}else if(e.key==='Tab'){e.preventDefault();const c=candidates(d,s.mode,tin.value).filter(x=>/^[a-z\/-]/.test(x));if(c.length===1&&!/\s$/.test(tin.value))tin.value=tin.value.replace(/\S*$/,c[0]+' ');}else if(e.key==='ArrowUp'){e.preventDefault();if(s.hi>0)tin.value=s.hist[--s.hi];}else if(e.key==='ArrowDown'){e.preventDefault();tin.value=s.hi<s.hist.length-1?s.hist[++s.hi]:(s.hi=s.hist.length,'');}};
tin.onpaste=e=>{const text=e.clipboardData.getData('text');if(!/[\r\n]/.test(text))return;e.preventDefault();const lines=text.split(/\r?\n/).filter(x=>x.trim());if(lines.length>100||lines.some(x=>x.length>512)){notify('Paste up to 100 commands, each under 512 characters.');return;}dialog('Review pasted commands',`<p>Run these ${lines.length} commands on <b>${esc(cur.net.devs[cur.sel].hostname)}</b> in the order shown.</p><pre class="paste-preview">${esc(lines.join('\n'))}</pre><button class="btn primary" id="runPaste">Run commands</button>`);$('runPaste').onclick=()=>{$('dialog').close();lines.forEach(execute);tin.value='';tin.focus();};};
openLab(Math.max(0,Math.min(LABS.length-1,lastLab)));

</script>
