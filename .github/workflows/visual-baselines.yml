name: Update screenshot baselines
# Run by hand (Actions › Update screenshot baselines › Run workflow) after an intended visual change.
# It makes new Linux baselines and commits them to the branch it ran on.
# A push whose commit message contains [baselines] runs it too (a hand-run workflow must exist on main first).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
permissions:
  contents: write
jobs:
  baselines:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baselines]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test visual.spec --project=chromium --update-snapshots
        env:
          CI: '1'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/__screenshots__
          git diff --cached --quiet || git commit -m "Update screenshot baselines"
          git push
