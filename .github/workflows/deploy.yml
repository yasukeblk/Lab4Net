name: Test and deploy
# Every pull request and every push to main runs the whole test suite (the job "browser").
# A push to main (or a hand run on main) then deploys the site to GitHub Pages, but only if every test passed.
# Needs Settings › Pages › Source set to "GitHub Actions" (see CHANGES.md, "Safe deploys").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run at a time per branch. Pull request runs replace older ones; runs on main wait their turn.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: index.html is built from src/
        run: node tools/build.cjs --check
      - name: Every Node test
        run: node tests/run-node.cjs
      - name: Lesson pages and sitemap are up to date
        run: |
          node tools/build-site.cjs
          if [ -n "$(git status --porcelain -- lessons sitemap.xml)" ]; then
            git status --short -- lessons sitemap.xml
            echo "::error::lessons/ or sitemap.xml is out of date. Run node tools/build-site.cjs and commit the result."
            exit 1
          fi
      - name: The share image is up to date
        run: node tools/build-og.cjs --check
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  # Building and publishing are two jobs. deploy-pages asks GitHub for this run's uploads once, straight away, and
  # fails if the site isn't listed yet. In one job it asked under a second after the upload, and on 19 Nov 2026 GitHub
  # hadn't listed it in time, three runs in a row. A second job starts on a fresh machine, which gives GitHub that time.
  # It also means "Re-run failed jobs" re-runs only the publish, with the same upload, instead of uploading a second
  # copy (which deploy-pages refuses).
  pages:
    needs: browser
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the site
        # site/: the app with each lesson's text in its own file, the lesson pages, sitemap, share image and licences at
        # the same addresses as before, and the single file as lab4net.html for offline use (tools/build.cjs --site).
        run: node tools/build.cjs --site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      # If GitHub still doesn't list the upload, wait a minute and try once more. A failed lookup stops before anything
      # is published, so the second try is safe. If that fails too, the job fails.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait a minute before trying again
        if: steps.first.outcome == 'failure'
        run: |
          echo "::warning::The first publish failed (see above). Trying once more in 60 seconds."
          sleep 60
      - id: again
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
