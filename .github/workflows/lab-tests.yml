name: Simulator regression checks
# The quick checks: the build and every Node test, on every push to a branch and every pull request.
# On main, and for the browser tests, see deploy.yml ("Test and deploy").
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build.cjs --check
      - run: node tests/build.cjs
      - run: node tests/slugs.cjs
      - run: node tests/grade.cjs
      - run: node tests/migrate.cjs
      - run: node tests/validate.cjs
      - run: node tests/labs.cjs
      - run: node tests/forwarding.cjs
      - run: node tests/curriculum.cjs
      - run: node tests/lessons.cjs
      - run: node tests/ping.cjs
      - run: node tests/console.cjs
      - run: node tests/switching.cjs
      - run: node tests/prompts.cjs
      - run: node tests/exam.cjs
      - run: node tests/quiz.cjs
      - run: node tests/duplex.cjs
      - run: node tests/ping6.cjs
      - run: node tests/campaign.cjs
      - run: node tests/ospfarea.cjs
      - run: node tests/sitepages.cjs
