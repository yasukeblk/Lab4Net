name: Simulator regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/labs.cjs
      - run: node tests/forwarding.cjs
      - run: node tests/sandbox.cjs
      - run: node tests/hardware.cjs
