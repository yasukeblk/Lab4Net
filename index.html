:root{

  --yel:#ffd23f; --org:#ff8a1f; --mag:#ff3d81; --vio:#a23bff; --cy:#2ee6ff; --go:#5cf08a; --bad:#ff5468; --crt:#07080d; --ph:#ffb84a;

}

.small-btn{font-size:14px;padding:4px 11px;border-width:2px;border-radius:7px;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 3px 0 #120e2b,0 6px 10px rgba(0,0,0,.4)}
.btn:hover,.small-btn:hover{transform:skewX(-8deg) translateY(-2px);filter:brightness(1.15)}
.btn:active{transform:skewX(-8deg) translateY(4px);box-shadow:0 1px 0 #120e2b}
.small-btn:active{transform:skewX(-8deg) translateY(3px);box-shadow:none}
.btn.primary{color:#221400;background:linear-gradient(#fff3a0,var(--yel) 45%,var(--org));box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 5px 0 #8a3f00,0 12px 22px rgba(0,0,0,.45),0 0 22px rgba(255,210,63,.35)}
.btn.primary:active{box-shadow:0 1px 0 #8a3f00}
.btn:disabled{opacity:.4;filter:none;cursor:default}
.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;padding-left:4px}
select{font:italic 700 16px var(--px);letter-spacing:.02em;background:#120e2b;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:6px 10px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.4)}
select:hover{box-shadow:0 0 0 1px var(--cy),0 0 14px rgba(46,230,255,.35)}
kbd{font:400 17px/1 var(--mono);border:2px solid var(--line);border-radius:5px;box-shadow:0 2px 0 #000;background:var(--panel3);padding:0 6px;margin:0 2px}
code{font:400 1.22em/1 var(--mono);background:rgba(46,230,255,.12);color:#a8f5ff;padding:0 5px;border-radius:4px}

/* top bar */
header{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:46px;background:linear-gradient(#241b52,#140f30);border-bottom:3px solid var(--line);box-shadow:0 2px 0 var(--mag),0 6px 24px rgba(255,61,129,.35);position:relative;z-index:3}
h1{display:flex;align-items:center;gap:8px;font:italic 800 26px/1 var(--px);letter-spacing:.03em;text-transform:uppercase;margin:0 12px 0 0;white-space:nowrap;
  background:linear-gradient(#fff3a0,var(--yel) 50%,var(--org));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 10px rgba(255,210,63,.4))}
h1 svg{width:24px;height:24px}
h1 .w{fill:var(--yel)} h1 .l{fill:var(--mag);animation:blink 1.6s steps(1) infinite}
.header-actions{display:flex;align-self:stretch;gap:2px}
.header-actions .small-btn{border:0;box-shadow:none;background:transparent;transform:none;padding:0 12px;font-size:17px;height:100%;border-radius:0;color:var(--ink);position:relative}
.header-actions .small-btn::after{content:"";position:absolute;left:10px;right:10px;bottom:7px;height:3px;background:var(--yel);transform:scaleX(0) skewX(-20deg);transition:transform .18s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 10px var(--yel)}
.header-actions .small-btn:hover,.header-actions .small-btn:focus-visible{transform:none;color:var(--yel);filter:none}
.header-actions .small-btn:hover::after,.header-actions .small-btn:focus-visible::after{transform:scaleX(1) skewX(-20deg)}
.header-actions .small-btn:active{transform:none}
#labs{flex:0 1 320px;min-width:0;margin-left:8px}
#meter{margin-left:auto;display:flex;align-items:center;gap:12px;white-space:nowrap;font:italic 800 17px var(--px);letter-spacing:.03em;text-transform:uppercase}
.progressbar{width:190px;height:16px;border:3px solid var(--line);border-radius:4px;background:#0c0920;transform:skewX(-18deg);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 4px 10px rgba(0,0,0,.5);overflow:hidden}
.progressbar span{display:block;height:100%;background:linear-gradient(#fff3a0,var(--yel) 50%,var(--org));box-shadow:0 0 14px var(--yel);transition:width .6s cubic-bezier(.2,1.2,.3,1)}
#clock{font:400 20px var(--mono);color:var(--ph);margin-left:14px;padding-left:14px;border-left:2px solid rgba(255,255,255,.14);align-self:center;text-shadow:0 0 8px rgba(255,184,74,.5)}
.workspace-bar{display:flex;justify-content:space-between;gap:16px;padding:5px 16px;color:#c9c3ee;font:400 19px/1.1 var(--mono);background:rgba(7,6,15,.72);backdrop-filter:blur(6px)}
.workspace-bar b{font-weight:400;color:var(--ph);text-shadow:0 0 8px rgba(255,184,74,.5)}
.workspace-bar .cur{display:inline-block;width:9px;height:15px;background:var(--ph);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--ph)}
#saveStatus{color:var(--go)}
@keyframes blink{50%{opacity:0}}

/* windows */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:22px;padding:18px 22px 22px 18px}
#brief,#practice,#mapPanel,#console,dialog{background:linear-gradient(var(--panel2),var(--panel));border:3px solid var(--line);border-radius:12px;box-shadow:var(--lift)}
#mapPanel,#console{overflow:hidden}
#brief,#practice{padding:18px 20px;overflow-y:auto;min-height:0;min-width:0}
#brief::before,#practice::before,.panel-title,.console-toolbar,.dialog-heading{display:flex;align-items:center;gap:10px;min-height:36px;padding:4px 14px;color:#fff;font:italic 800 19px/1.1 var(--px);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.45);border-bottom:3px solid var(--line);
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.16) 0 6px,transparent 6px 14px) right/130px 100% no-repeat,linear-gradient(100deg,var(--mag),var(--vio) 65%,#5b3bff)}
#brief::before,#practice::before{content:"Mission";position:sticky;top:-18px;z-index:2;margin:-18px -20px 16px;color:#221400;text-shadow:0 1px 0 rgba(255,255,255,.5);
  background:repeating-linear-gradient(115deg,rgba(0,0,0,.14) 0 6px,transparent 6px 14px) right/130px 100% no-repeat,linear-gradient(100deg,#fff3a0,var(--yel) 40%,var(--org))}
#practice::before{content:"Practice"}
.console-toolbar{background:repeating-linear-gradient(115deg,rgba(255,255,255,.16) 0 6px,transparent 6px 14px) center/130px 100% no-repeat,linear-gradient(100deg,#19c8ff,#2a6bff 60%,#4b3bff)}
.panel-title,.console-toolbar,.dialog-heading{justify-content:space-between}
#brief h2,#practice h2{font:italic 800 34px/1.05 var(--px);letter-spacing:.01em;text-transform:uppercase;margin:4px 0 10px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}
#checkBody p,#brief p,#practice p{margin:0 0 12px;color:#d9d3f5}
#checkBody h3,#brief h3,#practice h3,#dialogBody h3{font:italic 800 19px var(--px);letter-spacing:.05em;text-transform:uppercase;color:var(--cy);margin:22px 0 12px;display:flex;align-items:center;gap:10px;text-shadow:0 0 12px rgba(46,230,255,.45)}
#checkBody h3::after,#brief h3::after,#practice h3::after,#dialogBody h3::after{content:"";flex:1;height:3px;background:linear-gradient(90deg,var(--cy),transparent);transform:skewX(-30deg);order:1;opacity:.7}
#checkBody h3 span,#brief h3 span{order:2;font-size:16px;background:var(--mag);color:#fff;padding:1px 9px;transform:skewX(-10deg);border-radius:4px;text-shadow:none;box-shadow:0 0 12px rgba(255,61,129,.5)}
.eyebrow{font:italic 800 16px var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--yel);display:flex;gap:9px;align-items:center;margin-bottom:2px}
.eyebrow span{background:var(--mag);color:#fff;padding:0 8px;transform:skewX(-10deg);border-radius:4px}
.lesson-tip{border-left:4px solid var(--cy);background:rgba(46,230,255,.08);border-radius:0 8px 8px 0;padding:9px 12px;margin:12px 0;font-size:14px;color:#d9d3f5}
.lesson-tip b{font:italic 800 16px var(--px);letter-spacing:.03em;text-transform:uppercase;color:#fff}
.lesson-tip p{margin:4px 0 0!important}
summary{font:italic 700 15px var(--px);letter-spacing:.04em;text-transform:uppercase;color:var(--yel);width:max-content;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}
details[open]>summary::before{content:"▾ "}
summary:hover{text-shadow:0 0 10px rgba(255,210,63,.7)}
.tasks details{margin-top:5px;font-size:14px;color:#d9d3f5}
.tasks details[open]{background:rgba(255,210,63,.08);border-left:4px solid var(--yel);border-radius:0 8px 8px 0;padding:6px 10px;animation:rise .25s ease-out}
.addressing summary{font-size:19px;color:var(--cy);margin-bottom:8px}
.table-wrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#120e2b}
th{font:italic 700 14px var(--px);letter-spacing:.06em;text-transform:uppercase;text-align:left;background:var(--panel3);color:#fff;padding:5px 9px}
td{padding:4px 9px;border-top:1px solid rgba(255,255,255,.07);vertical-align:top}
td:last-child{font:400 18px/1.15 var(--mono);color:var(--ph)}
.tasks{list-style:none;margin:0;padding:0}
.tasks>li{display:grid;grid-template-columns:34px 1fr;gap:12px;margin-bottom:13px;align-items:start}
.task-check{position:relative;display:block;width:34px;height:30px}
.task-check input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.task-check span{display:grid;place-items:center;width:34px;height:30px;font:italic 800 16px var(--px);color:#fff;background:linear-gradient(#4a3f96,#2c2462);border:2px solid var(--line);border-radius:7px;transform:skewX(-8deg);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 3px 0 #120e2b;transition:transform .15s cubic-bezier(.2,1.8,.4,1),background .15s}
.task-check:hover span{transform:skewX(-8deg) translateY(-2px)}
.task-check input:focus-visible+span{outline:3px solid var(--cy);outline-offset:2px}
.task-check input:checked+span{color:#062812;background:linear-gradient(#b6ffcf,var(--go));box-shadow:0 0 14px rgba(92,240,138,.6);transform:skewX(-8deg) scale(1.06)}
.checked>div{color:var(--muted)}
.gswitch{display:flex;align-items:center;gap:12px;font:italic 800 17px/1 var(--px);letter-spacing:.05em;text-transform:uppercase;margin:22px 0 -8px;cursor:pointer;width:max-content;position:relative}
.gswitch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.gswitch span{width:50px;height:24px;border:2px solid var(--line);border-radius:14px;background:#120e2b;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.15);transition:background .2s,box-shadow .2s}
.gswitch span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:linear-gradient(#fff,#b9b3e6);transition:left .2s cubic-bezier(.2,1.8,.4,1)}
.gswitch input:checked+span{background:linear-gradient(var(--go),#1fae6b);box-shadow:0 0 14px rgba(92,240,138,.6)}
.gswitch input:checked+span::after{left:28px}
.gswitch input:focus-visible+span{outline:3px solid var(--cy);outline-offset:2px}
.steps{margin-top:8px;border:2px solid var(--line);border-radius:8px;background:var(--crt);padding:5px 0 6px;box-shadow:inset 0 0 18px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08)}
.step-dev{font:italic 700 14px/1.4 var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--cy);padding:2px 11px 0}
.step{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:0;color:var(--ph);font:400 19px/1.25 var(--mono);padding:0 11px;white-space:pre-wrap;word-break:break-word;text-shadow:0 0 6px rgba(255,184,74,.35)}
.step .sp{color:#a8813f}
.step:hover,.step:focus-visible{background:rgba(255,184,74,.14);color:#fff;outline:0}
.step-note{font:400 13px/1.4 var(--ui);font-style:italic;color:#bdb6e0;padding:2px 11px}
#grade{margin-top:20px}
#grade strong{display:block;font:italic 800 24px var(--px);letter-spacing:.04em;text-transform:uppercase;padding:9px 14px;border:3px solid var(--line);border-radius:9px;background:var(--panel3);margin-bottom:8px;transform:skewX(-6deg);box-shadow:0 5px 0 #120e2b}
#grade strong.done{color:#062812;background:linear-gradient(#d7ffe4,var(--go) 55%,#1fae6b);box-shadow:0 5px 0 #0b5a30,0 0 28px rgba(92,240,138,.6);animation:punch .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes punch{from{transform:skewX(-6deg) scale(.6);opacity:0}}
#grade ul{list-style:none;margin:10px 0 14px;padding:0}
#grade li{position:relative;padding-left:26px;margin-bottom:5px;font-size:14px;animation:rise .3s ease-out both;animation-delay:calc(var(--i)*80ms)}
#grade li::before{position:absolute;left:2px;font:800 16px var(--px)}
#grade li.ok::before{content:"✓";color:var(--go);text-shadow:0 0 8px var(--go)}
#grade li.no::before{content:"✗";color:var(--bad)}
#grade li.no{color:#ffb3bc}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.sol{margin:0 0 10px}
.sol code{display:block;background:var(--crt);color:var(--ph);border:2px solid var(--line);border-radius:7px;padding:4px 10px;font-size:20px;line-height:1.2}
.sol span{display:block;font-size:13.5px;line-height:1.4;color:var(--muted);padding:4px 2px 0}
.good{color:var(--go)} .bad{color:#ff8a98}

/* practice */
.big{display:inline-block;font:400 48px/1 var(--mono);background:var(--crt);color:var(--ph);padding:8px 18px;border:3px solid var(--line);border-radius:10px;box-shadow:inset 0 0 22px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.1),0 10px 22px rgba(0,0,0,.5);margin:12px 0 18px;text-shadow:0 0 10px rgba(255,184,74,.6)}
.drill label{display:grid;grid-template-columns:170px minmax(0,300px) 24px;gap:10px;align-items:center;margin-bottom:9px;font-size:14px}
.drill input,.search{font:400 21px/1.1 var(--mono);padding:5px 10px;border:2px solid var(--line);border-radius:8px;background:#0c0920;color:var(--ink);min-width:0;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.drill input:focus,.search:focus{outline:0;box-shadow:0 0 0 2px var(--cy),0 0 16px rgba(46,230,255,.45)}
.drill .ok{color:var(--go);font:800 20px var(--px)} .drill .no{color:var(--bad);font:800 20px var(--px)}
.drill p{margin:-3px 0 10px 180px!important;font-size:14px}
.quiz-options{display:grid;gap:12px;margin:16px 0;max-width:720px}
.quiz-option{display:flex;gap:12px;align-items:center;text-align:left;font:400 15px var(--ui);color:var(--ink);background:linear-gradient(var(--panel3),#261f55);border:2px solid var(--line);border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 4px 0 #120e2b;padding:10px 12px;transition:transform .12s cubic-bezier(.2,1.6,.4,1),box-shadow .12s}
.quiz-option span{flex:none;display:grid;place-items:center;width:30px;height:28px;font:italic 800 17px var(--px);background:var(--yel);color:#221400;border-radius:6px;transform:skewX(-8deg)}
.quiz-option:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 0 2px var(--cy),0 0 18px rgba(46,230,255,.4),0 6px 0 #120e2b}
.quiz-option.correct{background:linear-gradient(#1f6b42,#134a2d);box-shadow:0 0 18px rgba(92,240,138,.5)}
.quiz-option.incorrect{background:linear-gradient(#7a2233,#521624)}
.quiz-option:disabled{cursor:default}

/* network map */
#bench{display:flex;flex-direction:column;gap:22px;min-height:0;min-width:0;overflow-y:auto;padding:0 10px 14px 0;margin:0 -10px -14px 0}
#mapPanel{flex:0 0 auto;display:flex;flex-direction:column}
.legend{font:400 13px var(--ui);color:#fff;text-transform:none;letter-spacing:0;font-style:normal;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.legend .good{color:#8dffb4} .legend .bad{color:#ffc0c7}
#topo{position:relative;background:radial-gradient(ellipse 80% 60% at 50% 115%,rgba(255,61,129,.30),transparent 70%),radial-gradient(ellipse 60% 50% at 50% -10%,rgba(46,230,255,.18),transparent 70%),linear-gradient(90deg,rgba(162,59,255,.10) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(rgba(162,59,255,.10) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(#150f33,#0c0920);box-shadow:inset 0 0 60px rgba(0,0,0,.7)}
#topo svg{display:block;width:100%;height:auto;max-height:31vh}
.wire{stroke-linecap:round}
.wire.base{stroke:var(--go);stroke-width:3;filter:drop-shadow(0 0 4px rgba(92,240,138,.9))}
.wire.flow{stroke:#fff;stroke-width:3;stroke-dasharray:2 22;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.wire.off{stroke:var(--bad);stroke-width:2.5;stroke-dasharray:5 7;opacity:.75}
.wire.flash{stroke:#fff;stroke-width:9;opacity:0;animation:flash .7s ease-out;filter:drop-shadow(0 0 8px #fff)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.port{font:400 12px var(--mono);fill:#c9c3ee;text-anchor:middle;paint-order:stroke;stroke:#0c0920;stroke-width:3px}
.led{rx:3px;stroke:var(--line);stroke-width:1.2}
.led.on{fill:var(--go);filter:drop-shadow(0 0 4px var(--go))} .led.off{fill:var(--bad)}
.dev{cursor:pointer;outline:none}
.gshadow{fill:url(#gSh)}
.dev .body{stroke:var(--line);stroke-width:2.5;stroke-linejoin:round}
.dev .scr{stroke:var(--line);stroke-width:2}
.dev .shine{stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.55;fill:none}
.dev .glyph{stroke:var(--line);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.dev .px{fill:var(--line)}
.dev .lamp{fill:var(--go);filter:drop-shadow(0 0 3px var(--go))}
.dev text{font:italic 800 15px var(--px);letter-spacing:.04em;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:var(--line);stroke-width:4px}
.dev .pop{transition:transform .18s cubic-bezier(.2,1.8,.4,1),filter .18s}
.dev:hover .pop,.dev:focus-visible .pop{transform:translateY(-3px);filter:brightness(1.18)}
.dev.sel .pop{filter:drop-shadow(0 0 8px rgba(255,210,63,.75))}
.selglow{fill:none;stroke:var(--yel);stroke-width:2.5;animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 5px var(--yel))}
@keyframes pulse{50%{transform:scale(1.14);opacity:.5}}
.selring{fill:url(#gY);stroke:var(--line);stroke-width:2;stroke-linejoin:round;animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.intro .pop{animation:dropin .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*80ms)}
@keyframes dropin{from{opacity:0;transform:translateY(-34px) scale(.7)}}
.intro .wire,.intro .led,.intro .port{animation:rise .5s ease-out both .3s}
.intro .wire.flow{animation:rise .5s ease-out both .3s,flow .9s linear infinite}
.pop.shake{animation:shake .4s ease-in-out}
@keyframes shake{15%{transform:translateX(-7px) rotate(-4deg)}35%{transform:translateX(7px) rotate(4deg)}55%{transform:translateX(-5px)}75%{transform:translateX(4px)}}
.pkt{fill:#fff;stroke-width:3}
.pkt.req{stroke:var(--cy);filter:drop-shadow(0 0 7px var(--cy))} .pkt.rep{stroke:var(--go);filter:drop-shadow(0 0 7px var(--go))}
.trail{stroke-width:6;stroke-linecap:round;animation:trail .9s ease-out forwards}
.trail.req{stroke:var(--cy);filter:drop-shadow(0 0 6px var(--cy))} .trail.rep{stroke:var(--go);filter:drop-shadow(0 0 6px var(--go))}
@keyframes trail{from{opacity:.9}to{opacity:0}}
.burst{fill:none;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:burst .55s cubic-bezier(.1,.8,.3,1) forwards}
.burst.hop{stroke:var(--cy);stroke-width:2.5;animation-duration:.4s}
.burst.good{stroke:var(--yel)} .burst.bad{stroke:var(--bad)} .burst.warn{stroke:var(--org)}
@keyframes burst{from{transform:scale(.3);opacity:1}to{transform:scale(1.7);opacity:0}}
.spark{stroke:var(--line);stroke-width:2.5;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;animation:spark .5s cubic-bezier(.2,1.8,.4,1) forwards}
.spark.good{fill:url(#gY)} .spark.bad{fill:#ff6b7c} .spark.warn{fill:var(--org)}
@keyframes spark{0%{transform:scale(.15) rotate(-30deg);opacity:1}55%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1.3) rotate(14deg);opacity:0}}
.bit{animation:bit .6s cubic-bezier(.1,.8,.3,1) forwards}
.bit.good{fill:var(--yel)} .bit.bad{fill:var(--bad)} .bit.warn{fill:var(--org)}
@keyframes bit{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.fxlabel{font:italic 800 17px var(--px);letter-spacing:.06em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--line);stroke-width:5px;transform-box:fill-box;transform-origin:center;animation:label 3.2s cubic-bezier(.2,1.6,.4,1) forwards}
.fxlabel.good{fill:var(--yel)} .fxlabel.bad{fill:#ff8a98} .fxlabel.warn{fill:var(--org)}
@keyframes label{0%{opacity:0;transform:scale(.4) skewX(-10deg)}9%{opacity:1;transform:scale(1.12) skewX(-10deg)}14%{transform:scale(1) skewX(-10deg)}85%{opacity:1;transform:scale(1) skewX(-10deg)}100%{opacity:0;transform:scale(1) skewX(-10deg)}}
.clear{font:italic 800 62px var(--px);letter-spacing:.03em;fill:url(#gY);text-anchor:middle;paint-order:stroke;stroke:var(--line);stroke-width:9px;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 6px 0 rgba(0,0,0,.65)) drop-shadow(0 0 22px rgba(255,210,63,.75));animation:clearin 2.8s cubic-bezier(.2,1.5,.3,1) forwards}
@keyframes clearin{0%{opacity:0;transform:translateX(-160px) skewX(-22deg) scale(.8)}10%{opacity:1;transform:translateX(0) skewX(-10deg) scale(1.1)}16%{transform:translateX(0) skewX(-10deg) scale(1)}82%{opacity:1;transform:translateX(0) skewX(-10deg) scale(1)}100%{opacity:0;transform:translateX(140px) skewX(-22deg) scale(1)}}
#trace{border-top:3px solid var(--line);background:rgba(7,6,15,.55);padding:10px 14px;font-size:14px}
#trace{min-height:112px}
#trace:empty::before{content:"Ping, telnet or ssh between devices and the path is traced here.";color:var(--muted)}
#trace p:last-child:not(:first-of-type){display:none}
.trace-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font:italic 800 19px var(--px);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.trace-path{font:400 19px/1.2 var(--mono);color:var(--ph)}
.trace-path b{font:italic 700 14px var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--cy);display:inline-block;min-width:70px}
#trace p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}

/* console */
#console{flex:1 0 auto;height:0;min-height:250px;display:flex;flex-direction:column}
.console-toolbar>div{display:flex;align-items:center;gap:10px;min-width:0}
.mode-pill{background:#0c0920;color:var(--yel);font:italic 700 15px var(--px);letter-spacing:.05em;padding:2px 10px;border:2px solid var(--line);border-radius:6px;white-space:nowrap;transform:skewX(-8deg);text-shadow:none}
#deviceInfo{font:400 13px var(--ui);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0;font-style:normal}
#tabs{display:flex;gap:5px;padding:9px 12px 0;background:#120e2b;border-bottom:3px solid var(--line);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:7px;font:italic 700 16px var(--px);letter-spacing:.05em;text-transform:uppercase;background:linear-gradient(#3a3170,#2a2358);color:#cfc9f0;border:2px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;padding:4px 14px 5px;margin-bottom:-3px;white-space:nowrap;transition:transform .12s cubic-bezier(.2,1.6,.4,1)}
.tab:hover{color:#fff;transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--crt);color:var(--ph);box-shadow:0 -3px 14px rgba(255,184,74,.3);text-shadow:0 0 8px rgba(255,184,74,.6)}
.device-dot{width:9px;height:9px;border-radius:50%;background:var(--cy);border:1.5px solid var(--line);box-shadow:0 0 6px var(--cy)}
.device-dot.switch{background:var(--mag);box-shadow:0 0 6px var(--mag)} .device-dot.pc{background:#fff;box-shadow:0 0 6px #fff}
#term{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;cursor:text;color:var(--ph);font:400 20px/1.22 var(--mono);text-shadow:0 0 7px rgba(255,184,74,.45);
  background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 22%),repeating-linear-gradient(rgba(255,255,255,.03) 0 1px,transparent 1px 4px),radial-gradient(ellipse at center,#14171f 50%,var(--crt) 100%);box-shadow:inset 0 0 70px rgba(0,0,0,.85);scrollbar-color:#8a6a34 transparent}
#tout{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
#tout .cmd{color:#ffe7bd}
#tout .good{color:#8dffb4;text-shadow:0 0 7px rgba(125,255,176,.45)}
#tout .bad{color:#ff95a0;text-shadow:0 0 7px rgba(255,138,138,.45)}
#tout .warn{color:#ffe066}
#tout .new{animation:rise .18s ease-out both}
#inrow{display:flex}
#prompt{white-space:pre;color:#ffe7bd}
#tin{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:0;color:#fff;font:inherit;text-shadow:inherit;caret-color:var(--ph);caret-shape:block}
#hint{flex:none;font:400 13.5px/1.4 var(--ui);padding:8px 14px;background:#120e2b;border-top:3px solid var(--line);color:var(--muted);min-height:37px}
#hint.why{color:#fff3c4;box-shadow:inset 4px 0 0 var(--yel);background:linear-gradient(90deg,rgba(255,210,63,.18),#120e2b 60%);animation:slidein .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes slidein{from{opacity:0;transform:translateX(-16px)}}

/* dialogs */
dialog{padding:0;color:var(--ink);width:min(940px,calc(100vw - 32px));max-height:calc(100vh - 56px);overflow:hidden;box-shadow:var(--lift),0 0 60px rgba(162,59,255,.35)}
dialog[open]{display:flex;flex-direction:column;animation:pop .28s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}}
dialog::backdrop{background:rgba(8,6,20,.72);backdrop-filter:blur(5px)}
.dialog-heading h2{font:inherit;margin:0}
#dialogBody{overflow:auto;padding:16px 20px 22px}
#dialogBody>p{margin:0 0 12px;max-width:70ch;color:#d9d3f5}
.search{width:100%;margin-bottom:6px}
.search::placeholder{color:#7d75aa}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:6px}
.lab-card,.command-card{display:flex;flex-direction:column;gap:4px;text-align:left;font:400 13.5px/1.4 var(--ui);color:#d9d3f5;background:linear-gradient(var(--panel3),#231c52);border:2px solid var(--line);border-radius:11px;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 5px 0 #120e2b,0 12px 18px rgba(0,0,0,.4);padding:11px 13px;transition:transform .14s cubic-bezier(.2,1.6,.4,1),box-shadow .14s}
.lab-card:hover,.command-card:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--cy),0 0 22px rgba(46,230,255,.45),0 8px 0 #120e2b}
.lab-card:active,.command-card:active{transform:translateY(3px);box-shadow:0 1px 0 #120e2b}
.lab-card b{font:italic 800 21px/1.1 var(--px);letter-spacing:.02em;text-transform:uppercase;color:#fff}
.lab-card small,.command-card small{font:italic 700 13px var(--px);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.practice-buttons{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;padding-left:4px}
.reference-tools{display:flex;gap:14px;align-items:center}
.reference-tools label{white-space:nowrap;font:italic 700 15px var(--px);letter-spacing:.04em;text-transform:uppercase}
#cmdList{display:grid;gap:12px;margin-top:12px}
.command-card code{font-size:21px;background:var(--crt);color:var(--ph);padding:2px 9px;border-radius:6px;align-self:flex-start}
.help-steps p{margin:0 0 12px;color:#d9d3f5}
.help-steps b{font:italic 800 17px var(--px);letter-spacing:.03em;text-transform:uppercase;color:var(--yel)}
.paste-preview{background:var(--crt);color:var(--ph);font:400 19px/1.2 var(--mono);padding:10px 12px;border:2px solid var(--line);border-radius:8px;max-height:40vh;overflow:auto}
.skip{position:absolute;left:-999px;top:0;background:var(--yel);color:#221400;padding:8px 12px;font:italic 800 16px var(--px);z-index:200}
.skip:focus{left:8px;top:8px}
#notice{position:fixed;left:20px;bottom:20px;z-index:60;max-width:460px;background:linear-gradient(var(--panel3),var(--panel));color:var(--ink);font:italic 700 16px var(--px);letter-spacing:.03em;padding:10px 16px;border:3px solid var(--line);border-radius:10px;box-shadow:0 0 0 2px var(--yel),0 0 22px rgba(255,210,63,.4),0 12px 24px rgba(0,0,0,.5);cursor:pointer;animation:slidein .3s cubic-bezier(.2,1.4,.4,1)}
#notice:empty{display:none}


/* movable windows + pop-out guide */
.guide-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0 -8px}
.guide-row .gswitch{margin:0}
#guideWin{display:none;flex-direction:column;overflow:hidden;background:linear-gradient(var(--panel2),var(--panel));border:3px solid var(--line);border-radius:12px;box-shadow:var(--lift),0 0 30px rgba(92,240,138,.2)}
#guideWin .panel-title{flex:none;color:#062812;text-shadow:0 1px 0 rgba(255,255,255,.5);background:repeating-linear-gradient(115deg,rgba(0,0,0,.12) 0 6px,transparent 6px 14px) center/130px 100% no-repeat,linear-gradient(100deg,#d7ffe4,var(--go) 45%,#12a36a)}
#guideBody{flex:1;min-height:0;overflow:auto;padding:14px 18px 18px}
#guideBody h2{font:italic 800 27px/1.05 var(--px);text-transform:uppercase;margin:4px 0 14px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.gtask{display:grid;grid-template-columns:34px 1fr;gap:12px;margin-bottom:14px}
.gtask>b{display:grid;place-items:center;width:34px;height:30px;font:italic 800 16px var(--px);color:#fff;background:linear-gradient(#4a3f96,#2c2462);border:2px solid var(--line);border-radius:7px;transform:skewX(-8deg)}
#snapV,#snapH,#snapPrev{display:none;position:absolute;pointer-events:none}
#snapV{top:0;bottom:0;width:2px;background:var(--cy);box-shadow:0 0 12px var(--cy);z-index:9998}
#snapH{left:0;right:0;height:2px;background:var(--cy);box-shadow:0 0 12px var(--cy);z-index:9998}
#snapPrev{z-index:9997;border:3px dashed var(--yel);border-radius:12px;background:rgba(255,210,63,.12);box-shadow:0 0 30px rgba(255,210,63,.3)}
.dragging{opacity:.96;box-shadow:var(--lift),0 0 0 2px var(--cy),0 0 34px rgba(46,230,255,.5)!important}
body[data-cur="move"] main *{cursor:move!important}
body[data-cur="ns-resize"] main,body[data-cur="ns-resize"] main *{cursor:ns-resize!important}
body[data-cur="ew-resize"] main,body[data-cur="ew-resize"] main *{cursor:ew-resize!important}
body[data-cur="nesw-resize"] main,body[data-cur="nesw-resize"] main *{cursor:nesw-resize!important}
body[data-cur="nwse-resize"] main,body[data-cur="nwse-resize"] main *{cursor:nwse-resize!important}
@media (min-width:861px){
  main.free{display:block;position:relative;padding:0}
  main.free #bench,main.free #side{display:contents}
  main.free #brief{max-height:none}
  main.free :is(#brief,#checkWin,#practice,#mapPanel,#console,#guideWin).fw{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);min-width:0;min-height:0;margin:0;flex:none}
  main.free #guideWin{display:flex}
  main.free #mapPanel{display:flex;flex-direction:column}
  main.free #topo{flex:1;min-height:0}
  main.free #topo svg{height:100%;max-height:none}
  body:has(main.free){overflow:hidden}
}

#side{display:flex;flex-direction:column;gap:22px;min-height:0;min-width:0}
#side #brief{flex:0 1 auto;max-height:45%}
#side:has(#checkWin[hidden]) #brief{flex:1;max-height:none}
#checkWin{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(var(--panel2),var(--panel));border:3px solid var(--line);border-radius:12px;box-shadow:var(--lift)}
#checkWin .panel-title{flex:none;color:#2a0d00;text-shadow:0 1px 0 rgba(255,255,255,.45);background:repeating-linear-gradient(115deg,rgba(0,0,0,.13) 0 6px,transparent 6px 14px) right/130px 100% no-repeat,linear-gradient(100deg,#ffd9a0,var(--org) 45%,#ff5c39)}
#checkBody{flex:1;min-height:0;overflow-y:auto;padding:2px 20px 18px}
#checkBody .guide-row{margin-top:16px}

/* rewards */
#labs{flex:0 1 250px}
#hud{display:flex;align-items:center;gap:9px;margin-left:auto;white-space:nowrap;font:italic 800 16px var(--px);letter-spacing:.04em;text-transform:uppercase}
#hud b{background:var(--mag);color:#fff;padding:1px 9px;border-radius:5px;transform:skewX(-10deg);box-shadow:0 0 12px rgba(255,61,129,.5)}
#hud .xpbar{width:120px;height:13px;border:2px solid var(--line);border-radius:3px;background:#0c0920;transform:skewX(-18deg);overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
#hud .xpbar i{display:block;height:100%;background:linear-gradient(#c9f9ff,var(--cy));box-shadow:0 0 10px var(--cy);transition:width .8s cubic-bezier(.2,1.2,.3,1)}
#hud .streak{color:var(--org);text-shadow:0 0 10px rgba(255,138,31,.6)}
#meter{margin-left:16px}
.progressbar{width:110px}
.wb-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.workspace-bar .small-btn{font:400 19px/1.1 var(--mono);letter-spacing:0;text-transform:none;color:#c9c3ee;background:none;border:0;border-radius:0;box-shadow:none;transform:none;padding:0;filter:none}
.workspace-bar .small-btn:hover,.workspace-bar .small-btn:focus-visible{color:var(--yel);transform:none;text-decoration:underline}
.workspace-bar .small-btn:active{transform:none}
#clock{margin:0;padding:0;border:0;font:400 19px/1.1 var(--mono)}
#combo{font:italic 800 19px var(--px);letter-spacing:.05em;color:var(--yel);text-shadow:0 2px 0 #000,0 0 12px rgba(255,210,63,.8);white-space:nowrap}
#combo.pop{animation:combo .32s cubic-bezier(.2,2,.4,1)}
#combo.break{color:#ffd0d6;animation:shake .4s ease-in-out}
@keyframes combo{from{transform:scale(1.8) rotate(-7deg)}}
#runHud{font:400 19px/1 var(--mono);text-transform:none;letter-spacing:0;font-style:normal;color:#2a0d00;text-shadow:none;white-space:nowrap}
#toasts{position:fixed;top:92px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center;min-width:270px;max-width:360px;padding:10px 14px;background:linear-gradient(var(--panel3),var(--panel));border:3px solid var(--line);border-radius:12px;box-shadow:0 0 0 2px var(--yel),0 0 26px rgba(255,210,63,.5),0 14px 26px rgba(0,0,0,.55);animation:toastin .45s cubic-bezier(.2,1.5,.4,1),toastout .4s ease-in 4.3s forwards}
.toast i{grid-row:1/4;font-style:normal;font-size:34px;color:var(--yel);text-shadow:0 0 14px rgba(255,210,63,.8)}
.toast small{font:italic 700 13px var(--px);letter-spacing:.08em;text-transform:uppercase;color:var(--yel)}
.toast b{font:italic 800 20px/1.1 var(--px);letter-spacing:.03em;text-transform:uppercase}
.toast span{font-size:13px;color:var(--muted)}
@keyframes toastin{from{transform:translateX(120%) skewX(-12deg);opacity:0}}
@keyframes toastout{to{transform:translateX(120%);opacity:0}}
#resultCard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9000;width:min(560px,calc(100vw - 32px));overflow:hidden;background:linear-gradient(var(--panel2),var(--panel));border:3px solid var(--line);border-radius:14px;box-shadow:var(--lift),0 0 0 2px var(--yel),0 0 60px rgba(255,210,63,.4);animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
#resultCard .panel-title{color:#221400;text-shadow:0 1px 0 rgba(255,255,255,.5);background:repeating-linear-gradient(115deg,rgba(0,0,0,.14) 0 6px,transparent 6px 14px) center/130px 100% no-repeat,linear-gradient(100deg,#fff3a0,var(--yel) 40%,var(--org))}
#resultBody{padding:18px 22px 22px}
.result{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:center}
.stamp{font:italic 800 160px/1 var(--px);text-align:center;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #000) drop-shadow(0 0 24px rgba(255,210,63,.6));animation:stamp .5s cubic-bezier(.2,1.8,.4,1) .25s both}
@keyframes stamp{from{transform:scale(3.2) rotate(-20deg);opacity:0}}
.rS{background-image:linear-gradient(#fff3a0,var(--yel) 50%,var(--org))}
.rA{background-image:linear-gradient(#d7ffe4,var(--go) 60%,#12a36a)}
.rB{background-image:linear-gradient(#c9f9ff,var(--cy) 60%,#2a7bff)}
.rC{background-image:linear-gradient(#e2d3ff,var(--vio))}
.rD{background-image:linear-gradient(#e6e3f5,#8f89b5)}
.rrows>div{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.09);animation:rise .3s ease-out both;animation-delay:calc(.5s + var(--i)*90ms)}
.rrows span{color:var(--muted)}
.rrows b{font:400 21px/1 var(--mono);color:var(--ph)}
.rrows small{font:400 13px var(--ui);color:var(--muted)}
.xpgain{font:italic 800 22px var(--px);letter-spacing:.04em;text-transform:uppercase;color:var(--cy)!important;margin:16px 0 4px!important;text-shadow:0 0 12px rgba(46,230,255,.5)}
.lab-card{position:relative}
.rankbadge{position:absolute;top:-12px;right:-9px;width:40px;height:40px;display:grid;place-items:center;font:italic 800 26px var(--px);color:#1a1200;border:3px solid var(--line);border-radius:10px;transform:rotate(8deg);box-shadow:0 4px 0 #120e2b,0 0 16px rgba(255,210,63,.5)}
.trophy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.trophy{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;padding:9px 12px;background:linear-gradient(var(--panel3),#231c52);border:2px solid var(--line);border-radius:10px;box-shadow:0 0 0 1px var(--yel),0 0 14px rgba(255,210,63,.25)}
.trophy i{grid-row:1/3;font-style:normal;font-size:28px;color:var(--yel)}
.trophy b{font:italic 800 17px/1.1 var(--px);letter-spacing:.03em;text-transform:uppercase}
.trophy span{font-size:12.5px;color:var(--muted)}
.trophy.locked{opacity:.45;box-shadow:none;filter:grayscale(1)}
#tip{position:fixed;z-index:9999;pointer-events:none;width:260px;padding:9px 12px;background:rgba(12,9,32,.96);border:2px solid var(--cy);border-radius:10px;box-shadow:0 0 18px rgba(46,230,255,.4),0 10px 20px rgba(0,0,0,.5)}
#tip b{display:block;font:italic 800 18px/1.1 var(--px);letter-spacing:.04em;text-transform:uppercase}
#tip span{font-size:12.5px;color:var(--muted)}
#tip table{border:0;background:transparent;margin-top:6px;border-radius:0}
#tip td{border:0;padding:1px 8px 1px 0;font:400 17px/1.15 var(--mono);color:var(--ph)}
#tip td:first-child{color:#c9c3ee}
#tip td.good{color:var(--go)} #tip td.bad{color:#ff8a98}

/* sandbox */
.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin:4px 6px 8px}
.tool-grid .btn{text-align:center;padding-left:8px;padding-right:8px}
.cable-list{list-style:none;margin:10px 0 0;padding:0}
.cable-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.08);font:400 19px/1.1 var(--mono);color:var(--ph)}
.cable-list li span:only-child{color:var(--muted);font:400 14px var(--ui)}
ul.plain{margin:0;padding-left:20px;color:#d9d3f5}
ul.plain li{margin-bottom:8px}
#topo.sandbox .dev{cursor:grab}
#topo.cabling .dev{cursor:crosshair}
.dev.pick .body{stroke:var(--yel);stroke-width:4;filter:drop-shadow(0 0 8px var(--yel))}
.emptyhint{font:italic 800 20px var(--px);letter-spacing:.05em;text-transform:uppercase;fill:#8d86bd;text-anchor:middle}
#tin:disabled{cursor:not-allowed}

#ctx{position:fixed;z-index:10001;min-width:230px;max-width:320px;max-height:calc(100vh - 16px);overflow:auto;padding:6px;background:linear-gradient(var(--panel3),var(--panel));border:3px solid var(--line);border-radius:12px;box-shadow:0 0 0 2px var(--cy),0 0 24px rgba(46,230,255,.45),0 16px 30px rgba(0,0,0,.6);animation:pop .18s cubic-bezier(.2,1.5,.4,1)}
#ctx b{display:block;font:italic 800 16px var(--px);letter-spacing:.05em;text-transform:uppercase;color:var(--cy);padding:4px 8px 6px}
#ctx button{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:6px 8px;color:var(--ink);font:400 14.5px var(--ui)}
#ctx button span{font:400 19px/1.1 var(--mono);color:var(--ph)}
#ctx button small{font-size:12.5px;color:var(--go)}
#ctx button:hover:not(:disabled),#ctx button:focus-visible{background:rgba(46,230,255,.16);outline:0}
#ctx button:disabled{opacity:.5;cursor:default}
#ctx button:disabled small{color:var(--muted)}
.hitwire{stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
.hitwire:hover{stroke:rgba(255,210,63,.35)}
.kit-list{display:grid;gap:12px;margin:2px 4px 6px}
.kit-list .lab-card b{font-size:18px}
#checkBody h3 span{white-space:nowrap}

#mapPanel{position:relative}
#zoomCtl{position:absolute;top:50px;right:16px;display:flex;gap:9px;z-index:2}
#zoomCtl .small-btn{min-width:34px;text-align:center}
.note{font:italic 700 15px var(--px);letter-spacing:.04em;fill:var(--cy);text-anchor:middle;paint-order:stroke;stroke:#0c0920;stroke-width:4px;cursor:grab}
.note:hover{fill:#fff}
.goals{list-style:none;margin:6px 0 12px;padding:0}
.goals li{position:relative;padding-left:26px;margin-bottom:6px;font-size:14px}
.goals li::before{position:absolute;left:2px;font:800 16px var(--px)}
.goals li.ok::before{content:"✓";color:var(--go);text-shadow:0 0 8px var(--go)}
.goals li.no::before{content:"○";color:var(--muted)}
.goals li.ok{color:#c9ffdd}
#topo.sandbox{cursor:grab}
/* boot */
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--crt);color:var(--ph);cursor:pointer}
#boot pre{font:400 28px/1.25 var(--mono);margin:0;min-width:340px;min-height:290px;text-shadow:0 0 9px rgba(255,184,74,.55)}
#boot.off{animation:crtoff .3s ease-in forwards}
@keyframes crtoff{to{transform:scaleY(.008);opacity:0}}

.mobile-nav{display:none}
@media (min-width:1500px){main{grid-template-columns:500px 1fr}}
@media (max-width:860px){
  body{height:auto}
  header{flex-wrap:wrap;padding:6px 10px;gap:6px}
  #labs{flex:1 1 100%;order:5;margin:0}
  #clock,#hud .xpbar{display:none}
  .wb-right{gap:10px}
  .progressbar{width:90px}
  .workspace-bar{font-size:16px}
  main{grid-template-columns:1fr;padding:12px 12px 20px}
  .mobile-nav{display:flex;gap:10px;padding:12px 14px 0}
  .mobile-nav button[aria-pressed="true"]{color:#221400;background:linear-gradient(#fff3a0,var(--yel) 45%,var(--org))}
  body.mobile-network #side{display:none}
  #side{display:block}
  #side>*+*{margin-top:16px}
  #brief{max-height:none!important}
  body:not(.mobile-network) #bench{display:none}
  #bench{overflow:visible;padding:0;margin:0}
  #console{height:440px;flex:none}
  #brief,#practice{overflow:visible}
  .drill label{grid-template-columns:1fr}
  .drill p{margin-left:0!important}
  .legend{display:none}
  #deviceInfo{display:none}
}
/* troubleshooting incidents, CCNA objective tags, study map, undo */
.small-btn:disabled{opacity:.45;filter:none;cursor:default}
.ccna-tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ccna-tags span{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--ui);color:#d9d3f5;background:#120e2b;border:2px solid var(--line);border-radius:6px;padding:3px 8px 3px 3px;box-shadow:0 0 0 1px rgba(46,230,255,.35)}
.ccna-tags b{font:italic 800 13px/1 var(--px);color:var(--night);background:var(--cy);border-radius:4px;padding:3px 5px}
.lesson-tip.inc{border-left-color:var(--org);background:rgba(255,138,31,.09)}
.clues{margin:12px 0 14px;padding:10px 12px;background:linear-gradient(#2a1f12,#1d160f);border:2px solid var(--line);border-radius:10px;box-shadow:0 0 0 1px rgba(255,138,31,.55),0 0 16px rgba(255,138,31,.18)}
.clues-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.clues-head b{font:italic 800 18px var(--px);letter-spacing:.05em;text-transform:uppercase;color:var(--org);text-shadow:0 0 10px rgba(255,138,31,.5)}
.clues-head span{font-size:12px;color:var(--muted)}
.clue{margin:8px 0;padding:7px 10px;background:rgba(0,0,0,.28);border-left:4px solid var(--org);border-radius:0 7px 7px 0;animation:clueIn .35s ease-out both}
.clue:nth-of-type(3){border-left-color:var(--yel)}.clue:nth-of-type(4){border-left-color:var(--bad)}
.clue i{font:italic 800 14px var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--yel)}
.clue p{margin:2px 0 0;font-size:14px;color:#efe6d6}
.clues .actions{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
@keyframes clueIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.study-next{margin:12px 0 16px;padding:12px 14px;background:linear-gradient(var(--panel3),#231c52);border:2px solid var(--line);border-radius:10px;box-shadow:0 0 0 1px var(--yel),0 0 16px rgba(255,210,63,.22)}
.study-next p{margin:8px 0 0;font-size:14px;color:#d9d3f5}
.study-domains{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.study-domain{padding:10px 12px;background:rgba(0,0,0,.22);border:2px solid var(--line);border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.07)}
.sd-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.sd-head b{font:italic 800 18px var(--px);letter-spacing:.03em;text-transform:uppercase}
.sd-head span{font-size:12px;color:var(--yel)}
.study-domain p{margin:4px 0 8px;font-size:13px;color:var(--muted)}
.study-meter{height:12px;margin-top:6px;border:2px solid var(--line);border-radius:3px;background:#0c0920;transform:skewX(-18deg);overflow:hidden}
.study-meter span{display:block;height:100%;background:linear-gradient(90deg,var(--go),var(--cy));box-shadow:0 0 10px var(--go);transition:width .6s}
.study-links{display:flex;flex-wrap:wrap;gap:8px}
.study-links .small-btn{font-size:13px}
.study-links .small-btn.passed{background:linear-gradient(#2f8a55,#1c5a37)}
.study-note{font-size:12px;color:var(--muted);margin-top:14px}
@media(max-width:620px){.study-domains{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}.selring,.selglow,.wire.flow,h1 .l,.workspace-bar .cur,.clear{animation:none!important}.fxlabel{opacity:1!important;animation:none!important}}

<script>
//ENGINE-START
const ip2n=s=>{const p=String(s).split('.');if(p.length!==4)return null;let n=0;for(const x of p){if(!/^\d+$/.test(x)||+x>255)return null;n=n*256+ +x;}return n;};
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const isIp=s=>ip2n(s)!==null;
const lenMask=l=>l===0?0:((0xFFFFFFFF<<(32-l))>>>0);
const maskLenN=n=>{for(let l=0;l<=32;l++)if(lenMask(l)===n)return l;return null;};
const netOf=(ip,len)=>(ip&lenMask(len))>>>0;
const IFT=['FastEthernet','GigabitEthernet','Loopback','Vlan'];
function parseIf(str){const m=/^([a-z]+)([\d\/.]+)$/i.exec(String(str).replace(/\s+/g,''));if(!m)return null;const t=IFT.find(t=>t.toLowerCase().startsWith(m[1].toLowerCase()));return t?t+m[2]:null;}
const shortIf=n=>n.replace('FastEthernet','Fa').replace('GigabitEthernet','Gi').replace('Loopback','Lo').replace('Vlan','Vl').replace('Port-channel','Po');
function sortIfs(names){const key=n=>{const t=IFT.findIndex(t=>n.startsWith(t));return [t].concat((n.match(/\d+/g)||[]).map(Number));};
  return names.slice().sort((a,b)=>{const x=key(a),y=key(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]??-1)-(y[i]??-1);if(d)return d;}return 0;});}
const pad=(s,n)=>String(s).padEnd(n);
// A router, or a Layer 3 switch with ip routing on: something that routes between its interfaces.
const isL3=d=>d.type==='router'||(d.type==='switch'&&!!d.ipRouting);
// Cisco type 7, shown once service password-encryption is on. It is a reversible obfuscation, not real encryption.
const SEVN=['emergencies','alerts','critical','errors','warnings','notifications','informational','debugging'];
const XLAT='dsfd;kfoA,.iyewrkldJKDHSUBsgvca69834ncxv9873254k;fg87';
function type7(pw){let s=0;for(const c of pw)s=(s+c.charCodeAt(0))%16;let o=String(s).padStart(2,'0');
  for(let k=0;k<pw.length;k++)o+=(pw.charCodeAt(k)^XLAT.charCodeAt((s+k)%XLAT.length)).toString(16).toUpperCase().padStart(2,'0');return o;}
const pwText=(d,pw)=>d.svcEnc?'7 '+type7(pw):pw;

function addIf(d,n,o){d.ifs[n]=Object.assign({name:n,ip:null,len:null,shutdown:false,desc:'',link:null,mode:'access',modeSet:false,accessVlan:1,native:1,allowed:'all',dot1q:null},o||{});return d.ifs[n];}
function mkRouter(name){const d={name,type:'router',hostname:name,ifs:{},statics:[],ospf:null,lines:{con:{},vty:{}}};['0/0','0/1','0/2'].forEach(x=>addIf(d,'GigabitEthernet'+x,{shutdown:true}));return d;}
function mkSwitch(name){const d={name,type:'switch',hostname:name,ifs:{},vlans:{1:{name:'default'}},gw:null,lines:{con:{},vty:{}}};
  for(let i=1;i<=8;i++)addIf(d,'FastEthernet0/'+i);addIf(d,'GigabitEthernet0/1');addIf(d,'GigabitEthernet0/2');addIf(d,'Vlan1',{shutdown:true});return d;}
function mkPC(name,ip,len,gw){const d={name,type:'pc',hostname:name,ifs:{},gw:gw?ip2n(gw):null};addIf(d,'FastEthernet0',{ip:ip2n(ip),len});return d;}
function mkNet(devs){const net={devs:{},links:[]};devs.forEach(d=>net.devs[d.name]=d);return net;}
function link(net,a,ai,b,bi){ai=parseIf(ai);bi=parseIf(bi);net.devs[a].ifs[ai].link={dev:b,ifn:bi};net.devs[b].ifs[bi].link={dev:a,ifn:ai};net.links.push({a,ai,b,bi});}
function setIp(net,dev,ifn,ip,len){const i=net.devs[dev].ifs[parseIf(ifn)];i.ip=ip2n(ip);i.len=len;i.shutdown=false;}

const allowed=(p,v)=>p.allowed==='all'||p.allowed.includes(v);
const phys=(d,i)=>i.name.includes('.')?d.ifs[i.name.split('.')[0]]:i;
function ifUp(net,d,i){
  if(i.shutdown||i.errdis)return false;
  if(i.name.startsWith('Loopback'))return true;
  if(i.name.startsWith('Vlan')){const v=+i.name.slice(4);if(!d.vlans[v])return false;
    return Object.values(d.ifs).some(p=>p.link&&!p.name.startsWith('Vlan')&&!p.routed&&ifUp(net,d,p)&&(p.mode==='trunk'?allowed(p,v):p.accessVlan===v||p.voiceVlan===v));}
  const p=phys(d,i);if(p.shutdown||p.errdis||!p.link)return false;
  const q=net.devs[p.link.dev].ifs[p.link.ifn];return !q.shutdown&&!q.errdis;
}
function l2peers(net,d,i){
  const out=[];if(i.name.startsWith('Loopback')||!ifUp(net,d,i))return out;
  const seen=new Set();
  function flood(sw,vlan,inPort,path){
    const k=sw.name+'|'+vlan;if(seen.has(k))return;seen.add(k);
    if(!sw.vlans[vlan])return;
    const svi=sw.ifs['Vlan'+vlan];if(svi&&svi!==i&&!svi.shutdown&&(svi.ip!==null||svi.v6on))out.push({dev:sw,ifc:svi,path});
    for(const p of Object.values(sw.ifs)){
      if(p===inPort||!p.link||p.name.startsWith('Vlan')||p.routed||!ifUp(net,sw,p))continue;
      let tag=null;
      if(p.mode==='trunk'){if(!allowed(p,vlan))continue;tag=vlan===p.native?null:vlan;}
      else if(p.accessVlan!==vlan){if(p.voiceVlan===vlan)tag=vlan;else continue;}
      deliver(net.devs[p.link.dev],p.link.ifn,tag,path);
    }
  }
  function deliver(dev,ifn,tag,previous){
    const path=previous.concat(dev.name);
    const port=dev.ifs[ifn];
    // A routed switch port (no switchport) behaves like a router interface.
    if(dev.type==='switch'&&port.routed){if(tag===null&&(port.ip!==null||port.v6on)&&port!==i)out.push({dev,ifc:port,path});return;}
    if(dev.type==='switch'){
      let vlan;
      if(port.mode==='trunk'){vlan=tag===null?port.native:tag;if(!allowed(port,vlan))return;}
      else if(tag!==null&&port.voiceVlan===tag)vlan=tag;
      else{if(tag!==null&&tag!==port.accessVlan)return;vlan=port.accessVlan;}
      flood(dev,vlan,port,path);
    }else if(dev.phone){
      // An IP phone is a small two-port bridge: its own traffic uses the voice VLAN it learned over CDP (untagged
      // if it learned none); the PC port passes untagged frames straight through to the switch port.
      const up=dev.ifs.FastEthernet0,pcp=dev.ifs.FastEthernet1,vv=phoneVlan(net,dev);
      if(port===pcp){if(tag===null&&up.link&&ifUp(net,dev,up))deliver(net.devs[up.link.dev],up.link.ifn,null,path);}
      else if(tag===null){if(pcp.link&&ifUp(net,dev,pcp))deliver(net.devs[pcp.link.dev],pcp.link.ifn,null,path);if(vv==null&&(up.ip!==null||up.v6on)&&up!==i)out.push({dev,ifc:up,path});}
      else if(tag===vv&&up.ip!==null&&up!==i)out.push({dev,ifc:up,path});
    }else if(tag===null){if((port.ip!==null||port.v6on)&&port!==i)out.push({dev,ifc:port,path});}
    else for(const s of Object.values(dev.ifs))if(s.name.startsWith(ifn+'.')&&s.dot1q===tag&&!s.shutdown&&s!==i)out.push({dev,ifc:s,path});
  }
  if(d.type==='switch'&&!i.routed)flood(d,+i.name.slice(4),null,[d.name]);
  else{const p=phys(d,i);const tag=d.phone?phoneVlan(net,d):p===i?null:i.dot1q;if(!d.phone&&p!==i&&tag==null)return out;deliver(net.devs[p.link.dev],p.link.ifn,tag,[d.name]);}
  return out;
}
function connected(net,d){const r=[];for(const i of Object.values(d.ifs))if(i.ip!==null&&ifUp(net,d,i))r.push({code:'C',net:netOf(i.ip,i.len),len:i.len,ifc:i,nh:null,ad:0});return r;}
function ospfIfs(net,d){if(!d.ospf)return [];const r=[];for(const i of Object.values(d.ifs)){if(i.ip===null||!ifUp(net,d,i))continue;
  if(i.ospfArea!=null){r.push({ifc:i,area:i.ospfArea});continue;}
  const n=d.ospf.networks.find(n=>((i.ip&~n.wild)>>>0)===((n.net&~n.wild)>>>0));if(n)r.push({ifc:i,area:n.area});}return r;}
// Hello and dead intervals: dead defaults to four hellos. Both must match for two routers to become neighbors.
const ospfTimers=i=>{const h=i.ospfHello||10;return [h,i.ospfDead||h*4];};
const isPassive=(d,n)=>d.ospf.passiveDef?!(d.ospf.nonPassive||[]).includes(n):d.ospf.passive.includes(n);
function ospfNeighbors(net,d){const res=[];if(d.ospf&&d.ospf.resetting)return res;for(const o of ospfIfs(net,d)){if(isPassive(d,o.ifc.name))continue;
  for(const p of l2peers(net,d,o.ifc)){const pd=p.dev;if(!isL3(pd)||!pd.ospf)continue;
    const po=ospfIfs(net,pd).find(x=>x.ifc===p.ifc);if(!po||po.area!==o.area||isPassive(pd,p.ifc.name)||pd.ospf.resetting)continue;
    if(ospfTimers(o.ifc).join()!==ospfTimers(p.ifc).join())continue;
    if(routerId(pd)===routerId(d))continue;
    if(p.ifc.len!==o.ifc.len||netOf(p.ifc.ip,p.ifc.len)!==netOf(o.ifc.ip,o.ifc.len))continue;
    res.push({dev:pd,ifc:o.ifc,pifc:p.ifc});}}return res;}
function routerId(d){if(d.ospf&&d.ospf.active!=null)return d.ospf.active;if(d.ospf&&d.ospf.rid!=null)return d.ospf.rid;const all=Object.values(d.ifs).filter(i=>i.ip!==null);const lo=all.filter(i=>i.name.startsWith('Loopback'));const s=(lo.length?lo:all).map(i=>i.ip);return s.length?Math.max(...s):0;}
// Interface cost is reference bandwidth (100 Mbps unless auto-cost changes it) divided by the interface speed, at least 1.
function ospfCost(d,i){if(i.ospfCost!=null)return i.ospfCost;const ref=(d.ospf&&d.ospf.refBw)||100,bw=i.name.startsWith('Fast')?100:i.name.startsWith('Loop')?8000000:1000;return Math.max(1,Math.floor(ref/bw));}
// Shortest-path first over the adjacencies, then each router's OSPF networks at its distance plus its interface cost.
function ospfRoutes(net,d){if(!d.ospf)return [];
  const dist=new Map([[d.name,{cost:0,first:null}]]),done=new Set();
  for(;;){let u=null;for(const [n,v] of dist)if(!done.has(n)&&(u===null||v.cost<dist.get(u).cost))u=n;if(u===null)break;done.add(u);
    const U=net.devs[u],du=dist.get(u);
    for(const nb of ospfNeighbors(net,U)){if((nb.ifc.ospfNet||'broadcast')!==(nb.pifc.ospfNet||'broadcast'))continue;const c=du.cost+ospfCost(U,nb.ifc),cur=dist.get(nb.dev.name);if(!cur||c<cur.cost)dist.set(nb.dev.name,{cost:c,first:du.first||{ifc:nb.ifc,nh:nb.pifc.ip}});}}
  const own=new Set(connected(net,d).map(c=>c.net+'/'+c.len)),best=new Map();
  for(const [name,info] of dist){if(name===d.name)continue;const R=net.devs[name];for(const o of ospfIfs(net,R)){
    // OSPF advertises a loopback as a /32 host route whatever its configured mask.
    const lo=o.ifc.name.startsWith('Loopback'),len=lo?32:o.ifc.len,nn=lo?o.ifc.ip:netOf(o.ifc.ip,o.ifc.len),k=nn+'/'+len,metric=info.cost+ospfCost(R,o.ifc);
    if(own.has(k)||(best.has(k)&&best.get(k).metric<=metric))continue;best.set(k,{key:k,code:'O',net:nn,len,ifc:info.first.ifc,nh:info.first.nh,ad:110,metric,from:routerId(R)});}}
  return [...best.values()];}
// A static route is usable when its exit interface is up, or when its next hop sits on a connected subnet.
function staticRoutes(net,d,conn){const r=[];
  for(const s of d.statics){const ad=s.ad||1;
    if(s.ifn){const i=d.ifs[s.ifn];if(!i||!ifUp(net,d,i))continue;r.push({code:'S',net:s.net,len:s.len,nh:s.nh??null,ifc:i,ad,st:s});}
    else if(conn.some(c=>netOf(s.nh,c.len)===c.net))r.push({code:'S',net:s.net,len:s.len,nh:s.nh,ad,st:s});}
  return r;}
// The routing table keeps, per prefix, only the route with the lowest administrative distance.
function routes(net,d){const conn=connected(net,d);
  if(!isL3(d)){if(d.gw!=null)conn.push({code:'S',net:0,len:0,nh:d.gw,ad:1});return conn;}
  const best=new Map();
  for(const x of conn.concat(staticRoutes(net,d,conn),ospfRoutes(net,d))){const k=x.net+'/'+x.len,b=best.get(k);if(!b||x.ad<b.ad)best.set(k,x);}
  return [...best.values()];}
// Longest prefix match. A static route with only an exit interface treats the destination as on-link (proxy ARP).
function nextHop(net,d,dst){const rt=routes(net,d);let best=null;
  for(const r of rt)if(netOf(dst,r.len)===r.net&&(!best||r.len>best.len))best=r;
  if(!best)return null;let ifc=best.ifc;const nh=best.nh==null?dst:best.nh;
  if(!ifc){const c=rt.find(c=>c.code==='C'&&netOf(nh,c.len)===c.net);if(!c)return null;ifc=c.ifc;}
  return {ifc,nh,proxy:best.code==='S'&&best.nh==null,route:best};}
// The active HSRP router also owns its group's virtual IP.
const ownsIp=(net,d,ip)=>Object.values(d.ifs).some(i=>(i.ip===ip||hsrpVip(net,d,i)===ip)&&ifUp(net,d,i));
function tracePath(net,src,dst){let d=src,hops=[],srcIp=null;
  for(let t=0;t<20;t++){
    if(ownsIp(net,d,dst))return {ok:true,hops,srcIp,dest:d};
    if(t>0&&d.type!=='router')return {ok:false,hops};
    const h=nextHop(net,d,dst);if(!h)return {ok:false,hops};
    if(t===0)srcIp=h.ifc.ip;
    const peer=l2peers(net,d,h.ifc).find(p=>p.ifc.ip===h.nh);if(!peer)return {ok:false,hops};
    hops.push(h.nh);d=peer.dev;}
  return {ok:false,hops};}
function canPing(net,src,dst){const f=tracePath(net,src,dst);if(!f.ok)return false;if(f.srcIp===null)return true;return tracePath(net,f.dest,f.srcIp).ok;}

function parseVlanList(s){const r=[];for(const part of s.split(',')){const m=/^(\d+)(?:-(\d+))?$/.exec(part.trim());if(!m)return null;const a=+m[1],b=m[2]?+m[2]:a;for(let v=a;v<=b&&v<4095;v++)r.push(v);}return r;}
function runningConfig(net,d){
  const L=['Building configuration...','','Current configuration:','!','version 15.2',...(d.tsLog?['service timestamps log datetime msec']:[]),(d.svcEnc?'':'no ')+'service password-encryption','!','hostname '+d.hostname,'!'];
  if(d.secret)L.push('enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0');
  if(d.enPass)L.push('enable password '+pwText(d,d.enPass));
  if(d.type==='switch'&&d.ipRouting)L.push('ip routing');
  if(d.noLookup)L.push('no ip domain-lookup');
  L.push('!');
  for(const n of sortIfs(Object.keys(d.ifs))){const i=d.ifs[n];L.push('interface '+n);
    if(i.desc)L.push(' description '+i.desc);
    if(i.dot1q!=null)L.push(' encapsulation dot1Q '+i.dot1q);
    if(d.type==='switch'&&i.routed&&!n.startsWith('Vlan'))L.push(' no switchport');
    if(d.type==='switch'&&!n.startsWith('Vlan')&&!i.routed){
      if(i.accessVlan!==1)L.push(' switchport access vlan '+i.accessVlan);
      if(i.encap)L.push(' switchport trunk encapsulation '+i.encap);
      if(i.allowed!=='all')L.push(' switchport trunk allowed vlan '+i.allowed.join(','));
      if(i.native!==1)L.push(' switchport trunk native vlan '+i.native);
      if(i.modeSet)L.push(' switchport mode '+i.mode);
    }else L.push(i.ip!==null?' ip address '+n2ip(i.ip)+' '+n2ip(lenMask(i.len)):' no ip address');
    if(i.shutdown)L.push(' shutdown');L.push('!');}
  if(d.ospf){L.push('router ospf '+d.ospf.pid);if(d.ospf.rid!=null)L.push(' router-id '+n2ip(d.ospf.rid));
    if(d.ospf.passiveDef){L.push(' passive-interface default');(d.ospf.nonPassive||[]).forEach(p=>L.push(' no passive-interface '+p));}else d.ospf.passive.forEach(p=>L.push(' passive-interface '+p));
    if(d.ospf.refBw&&d.ospf.refBw!==100)L.push(' auto-cost reference-bandwidth '+d.ospf.refBw);
    d.ospf.networks.forEach(n=>L.push(' network '+n2ip(n.net)+' '+n2ip(n.wild)+' area '+n.area));L.push('!');}
  if(d.type==='switch'&&d.gw!=null)L.push('ip default-gateway '+n2ip(d.gw));
  (d.statics||[]).forEach(s=>L.push('ip route '+n2ip(s.net)+' '+n2ip(lenMask(s.len))+(s.ifn?' '+s.ifn:'')+(s.nh!=null?' '+n2ip(s.nh):'')+(s.ad&&s.ad!==1?' '+s.ad:'')+(s.name?' name '+s.name:'')));
  if(d.banner)L.push('!','banner motd ^C'+d.banner+'^C');
  L.push('!');
  [['con','line con 0'],['vty','line vty 0 4']].forEach(([k,h])=>{L.push(h);const l=d.lines[k];if(l.aclClass)L.push(' access-class '+l.aclClass+' '+(l.aclDir||'in'));
    if(l.timeout&&(l.timeout[0]!==10||l.timeout[1]!==0))L.push(' exec-timeout '+l.timeout[0]+' '+l.timeout[1]);
    if(l.password)L.push(' password '+pwText(d,l.password));if(l.login)L.push(l.local?' login local':' login');if(l.transport)L.push(' transport input '+l.transport);});
  L.push('!','end');return L;}

function parseStatic(e,rest,needTarget){const t=rest.trim()?rest.trim().split(/\s+/):[],r={nh:null,ifn:null,ad:1,name:null};

  if(t.length&&isIp(t[0]))r.nh=ip2n(t.shift());
  if(t.length&&/^\d+$/.test(t[0])){r.ad=+t.shift();if(r.ad<1||r.ad>255)return null;}
  if(t.length&&'name'.startsWith(t[0].toLowerCase())&&t[1]){r.name=t[1];t.splice(0,2);}
  if(t.length&&'permanent'.startsWith(t[0].toLowerCase()))t.shift();
  if(t.length||(needTarget&&r.nh==null&&!r.ifn))return null;return r;}

function matchPat(pat,toks){const args=[];let i=0;
  for(const p of pat){
    if(p==='<rest>'){if(i>=toks.length)return 'partial';args.push(toks.slice(i).join(' '));return {args};}
    if(p==='<rest?>'){args.push(toks.slice(i).join(' '));return {args};}
    if(i>=toks.length)return 'partial';
    const t=toks[i];
    if(p==='<ip>'){if(!isIp(t))return null;args.push(ip2n(t));}
    else if(p==='<ip6>'){const a=parse6(t);if(a===null)return null;args.push(a);}
    else if(p==='<n>'){if(!/^\d+$/.test(t))return null;args.push(+t);}
    else if(p==='<w>')args.push(t);
    else if(!p.startsWith(t.toLowerCase()))return null;
    i++;}
  return i===toks.length?{args}:null;}
function run(env,line,mode){line=line.trim();if(!line)return;const toks=line.split(/\s+/),{d,s}=env;let partial=false;
  const find=m=>{for(const c of CMDS){if(!c.modes.includes(m)||(c.types&&!c.types.includes(d.type)))continue;const r=matchPat(c.pat,toks);if(r==='partial')partial=true;else if(r)return {c,args:r.args};}return null;};
  let m=find(mode);
  if(!m&&!['config','user','priv','pc'].includes(mode)){m=find('config');if(m){s.mode='config';s.ctx=null;}}
  if(m){env.args=m.args;m.c.fn(env);return;}
  env.out(partial?'% Incomplete command.':BAD);}
function execLine(net,d,s,line){const out=[];const env={net,d,s,out:(...x)=>out.push(...x)};
  const snap=()=>{const m={};for(const n in d.ifs)m[n]=ifUp(net,d,d.ifs[n]);return m;};
  const before=d.type==='pc'?null:snap();
  run(env,line,s.mode);
  // An administrative shutdown logs LINK-5-CHANGED; any other change of state logs LINK-3-UPDOWN.
  if(before){const after=snap();for(const n in after)if(!!before[n]!==after[n]){const st=after[n]?'up':'down';out.push(!after[n]&&d.ifs[n].shutdown?'%LINK-5-CHANGED: Interface '+n+', changed state to administratively down':'%LINK-3-UPDOWN: Interface '+n+', changed state to '+st,'%LINEPROTO-5-UPDOWN: Line protocol on Interface '+n+', changed state to '+st);}}
  return out;}
function promptOf(d,s){const h=d.hostname;switch(s.mode){case 'pc':return 'C:\\>';case 'user':return h+'>';case 'priv':return h+'#';case 'config':return h+'(config)#';
  case 'if':return h+(s.ctx.length>1?'(config-if-range)#':s.ctx[0].name.includes('.')?'(config-subif)#':'(config-if)#');case 'vlan':return h+'(config-vlan)#';case 'line':return h+'(config-line)#';default:return h+'(config-router)#';}}
const HELP={'<ip>':'A.B.C.D','<ip6>':'X:X:X:X::X','<n>':'<number>','<w>':'WORD','<rest>':'LINE','<rest?>':'<cr>'};
function candidates(d,mode,line){const sp=line===''||/\s$/.test(line);const toks=line.trim()?line.trim().split(/\s+/):[];const part=sp?'':toks.pop().toLowerCase();const set=new Set();
  for(const c of CMDS){if(!c.modes.includes(mode)||(c.types&&!c.types.includes(d.type)))continue;const pat=c.pat;let ok=true,rest=false;
    for(let j=0;j<toks.length;j++){const p=pat[j];if(p===undefined){ok=false;break;}if(p.startsWith('<rest')){rest=true;break;}if(p[0]==='<')continue;if(!p.startsWith(toks[j].toLowerCase())){ok=false;break;}}
    if(!ok)continue;if(rest){set.add('LINE');continue;}
    const p=pat[toks.length];if(p===undefined){if(!part)set.add('<cr>');continue;}
    if(p[0]==='<')set.add(HELP[p]);else if(p.startsWith(part))set.add(p);}
  return [...set];}

// ---------- explanations for labs 1-6 ----------
LABS[0].group='Fundamentals';LABS[1].group=LABS[2].group='Switching';LABS[3].group=LABS[4].group=LABS[5].group='Routing';
LABS[0].why=['A unique name tells you which console you are in, and it shows up in logs and in the SSH key name.','Privileged mode can change anything. enable secret stores a hash; enable password would sit in the config in clear text.','Anyone with physical access can plug into the console. The password does nothing until login tells the line to ask for it.','VTY lines are where remote sessions arrive. They need their own password and login before remote access is both possible and protected.','By default a mistyped word is treated as a hostname and the router stalls trying to resolve it.','The banner is the legal notice that access is restricted, which matters if misuse is ever investigated.','This address is the default gateway for the LAN. Router ports are shut down from the factory, so nothing passes until no shutdown.','Everything so far lives in RAM. A reload or power cut without saving puts you back to defaults.','A Layer 2 switch only needs an IP for management. It goes on the VLAN 1 interface, and the gateway lets the switch answer from other subnets.','Always verify. A ping from a host proves Layers 1 to 3 work end to end, not just that the config looks right.'];
LABS[1].why=['VLANs split one switch into separate broadcast domains, so departments do not see each other\'s broadcasts and can be secured separately. Names make the table readable.','An access port belongs to exactly one VLAN and sends untagged frames, which is what a PC expects. Setting the mode by hand stops the port negotiating a trunk.','Same reason, second VLAN. The port assignment is what actually separates the hosts.','show vlan brief is the fastest way to confirm ports landed in the VLAN you intended.','Same-VLAN hosts share a broadcast domain and can ARP for each other. Different VLANs cannot talk without a router, even on the same switch.'];
LABS[2].why=['VLANs are local to each switch. VLAN 10 must exist on both switches for its frames to be carried end to end.','Hosts only join a VLAN through their access port assignment.','A trunk tags each frame with its VLAN ID (802.1Q) so one cable can carry many VLANs between switches.','Trunks allow every VLAN by default. Pruning to the ones in use limits broadcasts and stops unused VLANs leaking across.','show interfaces trunk confirms the mode and the allowed list; the pings confirm frames keep their VLAN across the link.'];
LABS[3].why=['The router link must carry both VLANs, so it has to be a trunk on the switch side.','Subinterfaces follow the physical port. If the parent is shut down, all of them are down.','Each subinterface is the default gateway for one VLAN. The encapsulation line says which tag belongs to it, and IOS refuses an IP address until that is set.','One subinterface per VLAN: the router now has a connected route to each and can route between them.','Two connected routes, one per VLAN, are all the router needs. The ping crosses VLANs by going up the trunk and back down.'];
LABS[4].why=['A router only knows its connected networks. R1 has to be told about every remote network it must reach, including the transit link.','R2 sits in the middle and has to know both LANs. Routing is needed in both directions: a ping fails if the reply has no route back.','R3 is a stub with one way out, so a single default route replaces a list of specific ones.','Read the table before testing. S marks static routes and S* the default.','tracert shows each hop, which tells you exactly where a path breaks when a ping fails.'];
LABS[5].why=['A fixed router ID makes neighbor tables readable and avoids the ID changing when interfaces change.','The network command picks which interfaces run OSPF. All routers must agree on the area to become neighbors.','The LAN still gets advertised, but no hellos are sent toward hosts, where no neighbor could ever form.','FULL means adjacency is complete. O routes in the table are the networks learned from neighbors.','End-to-end pings confirm every router learned every LAN dynamically, with no static routes.'];

'service password-encryption':'Scrambles every clear-text password in the config (line, enable password, username password) with Cisco type 7. Type 7 is reversible, so it only stops shoulder-surfing; secrets are the real protection.',
'no enable password':'Removes the old clear-text enable password. When an enable secret exists IOS ignores the password anyway, but leaving it in the config hands out a password someone may reuse elsewhere.',
'exec-timeout <rest>':'Logs an idle session out after minutes and seconds. An unattended, logged-in console or SSH session is an open door. 0 0 disables the timer, which you should never do in production.',

'show running-config':'The configuration currently active in RAM. Read it before and after a change; it is also where clear-text passwords give themselves away.'});

 why:['Without router-id, OSPF picks the highest loopback address, or failing that the highest active interface address, when the process starts. That ID can surprise you, and neighbors that see a duplicate ID refuse to form at all.','The router ID is how every other router names this one in its database. A fixed, meaningful ID makes neighbor tables and logs readable at a glance.','The ID is chosen once, when the process starts. Changing it on a live router needs a restart of the process, which briefly drops every adjacency.','Any port that sends hellos will accept a neighbor. On a user LAN that means anyone with a router, or a laptop running routing software, can inject routes. Default-passive is the safe starting point.','The networks on passive interfaces are still advertised. Only the links that really have a neighbor router on them need hellos.','Check all three outcomes: the unwanted adjacency is gone, the routes you need are still there, and traffic still flows end to end.'],

addLab({title:'Per-VLAN root bridges',group:'Switching',

 addr:[['DSW1','Root for VLAN 10, backup for 20','MAC 0019.e8a2.3c00'],['DSW2','Root for VLAN 20, backup for 10','MAC 0019.e8a2.4d00'],['ASW1','Access switch, oldest','MAC 0009.7c11.0100'],['PC1 / PC3','VLAN 10 STAFF','192.168.10.11, .13'],['PC2 / PC4','VLAN 20 GUEST','192.168.20.12, .14']],
 tasks:['On ASW1, run <code>show spanning-tree vlan 10</code> and <code>show spanning-tree vlan 20</code>. Which switch is root, and why?','Switch all three switches to Rapid PVST+.','On DSW1, make it the primary root for VLAN 10 and the secondary root for VLAN 20.','On DSW2, make it the primary root for VLAN 20 and the secondary root for VLAN 10.','On ASW1, check both VLANs again: the root port for VLAN 10 should be Gi0/1 and for VLAN 20 Gi0/2, with the other uplink blocking in each.','Ping PC3 from PC1 and PC4 from PC2.'],
 why:['With every priority at the default 32768, the lowest MAC address wins, and the oldest switch usually has it. An access switch as root forces traffic through the weakest box in the network.','Rapid PVST+ runs a separate tree per VLAN, which is what makes per-VLAN roots possible, and it reconverges in about a second instead of 30 to 50.','root primary is a macro, not a value: it sets 24576, or 4096 below the current root if 24576 would not be enough. root secondary sets 28672, so this switch takes over if the primary fails.','Mirroring the roles splits the VLANs across the two distribution switches. Each one is the centre of one tree and the standby for the other.','Each VLAN has its own tree, so each blocks a different uplink. Both uplinks now carry traffic: VLAN 10 on one, VLAN 20 on the other. If either distribution switch fails, its VLAN fails over to the other.','Spanning tree changes paths, never reachability. Hosts in the same VLAN must still reach each other after the change.'],
 checks:[['All three switches run Rapid PVST+',n=>['DSW1','DSW2','ASW1'].every(s=>n.devs[s].stp&&n.devs[s].stp.mode==='rapid-pvst')],['DSW1 is root for VLAN 10 and DSW2 is root for VLAN 20',n=>stpCalc(n,10).root===n.devs.DSW1&&stpCalc(n,20).root===n.devs.DSW2],['Each distribution switch is secondary root for the other VLAN',n=>stpPrio(n.devs.DSW2,10)===28672+10&&stpPrio(n.devs.DSW1,20)===28672+20],['ASW1 uses Gi0/1 for VLAN 10 and Gi0/2 for VLAN 20, blocking the other uplink',n=>stpRole(n,'ASW1',10,'g0/1')==='Root'&&stpRole(n,'ASW1',10,'g0/2')==='Altn'&&stpRole(n,'ASW1',20,'g0/2')==='Root'&&stpRole(n,'ASW1',20,'g0/1')==='Altn'],['PC1 reaches PC3 and PC2 reaches PC4',n=>P(n,'PC1','192.168.10.13')&&P(n,'PC2','192.168.20.14')]],
 solution:{DSW1:['enable','configure terminal','spanning-tree mode rapid-pvst','spanning-tree vlan 10 root primary','spanning-tree vlan 20 root secondary','end'],
  DSW2:['enable','configure terminal','spanning-tree mode rapid-pvst','spanning-tree vlan 20 root primary','spanning-tree vlan 10 root secondary','end'],
  ASW1:['enable','configure terminal','spanning-tree mode rapid-pvst','end','show spanning-tree vlan 10']}},
 ['ASW1: enable | show spanning-tree vlan 10 | show spanning-tree vlan 20',
  'DSW1: enable | configure terminal | spanning-tree mode rapid-pvst ; DSW2: enable | configure terminal | spanning-tree mode rapid-pvst ; ASW1: configure terminal | spanning-tree mode rapid-pvst | end',

'show cdp neighbors':'Lists the Cisco devices directly connected to this one: their hostname, which of your ports they are on (Local Intrfce) and which of their ports you are on (Port ID). It sees only one hop.',

 tasks:['On EDGE, run <code>show cdp neighbors</code>. Work out which of EDGE\'s ports leads where, and the neighbor\'s port at the far end.','On EDGE, describe both cabled interfaces as <code>TO-&lt;neighbor hostname&gt;-&lt;neighbor port&gt;</code>, using the short port name CDP shows, for example <code>TO-SW9-Fa0/3</code>.','Do the same for the three cabled interfaces on CORE.','Do the same for the two cabled interfaces on ACC-A.','Do the same for the two cabled interfaces on ACC-B.','Stop CDP on EDGE\'s internet-facing interface only, then confirm on ISP-PE that EDGE has disappeared from <code>show cdp neighbors</code>.','On CORE, use <code>show cdp neighbors detail</code> to find ACC-B\'s management address, and ping it from EDGE.'],
 why:['CDP is a Layer 2 protocol, so it works before any IP is configured and between devices in different subnets. Device ID is the neighbor\'s hostname; Local Intrfce is your port; Port ID is theirs.','A description costs nothing and saves the next engineer from tracing cables. Naming both the device and its port means you can follow the cable from either end.','A core switch has the most links, so it is where a wrong label would mislead the most people. CDP runs per port, so every port gives its own answer.','Access switches often connect to each other as well as to the core. Those cross-links are easy to miss without discovery.','Fa0/8 on CORE is not where you would expect an uplink. CDP does not care about expectations; it reports what is really plugged in.','CDP advertises your hostname, model, software version and addresses to whoever is on the other end, including your provider or an attacker. Turn it off per interface where you do not trust the neighbor, and keep it inside, where it helps you.','The detail view gives each neighbor\'s management address, which turns discovery into something you can reach and log in to.'],

 tasks:['On R1, address G0/0 and G0/1 from the table and bring both up.','Add a default route to the ISP. From R1, ping 198.51.100.10: the router itself can already reach the internet.','Reserve 192.168.1.1 to 192.168.1.20, then create pool <code>OFFICE</code> for 192.168.1.0/24 with gateway 192.168.1.1 and DNS server 198.51.100.53.','On both PCs run <code>ipconfig /renew</code> and check the lease. Ping the web server from PC1: it fails. Why?','Create standard ACL 1 permitting 192.168.1.0/24, and mark G0/0 as NAT inside and G0/1 as NAT outside.','Translate everything ACL 1 permits to G0/1\'s address, with <code>overload</code>.','Test: PC1 opens the website with <code>telnet 198.51.100.10 80</code>, PC2 pings it, and <code>show ip nat translations</code> on R1 shows the shared address.'],
 why:['Router interfaces ship shut down with no address. The LAN address becomes the PCs\' gateway; the outside address is the one the ISP gave you.','A branch has one way out, so one default route covers the whole internet. R1\'s own pings work because they come from 203.0.113.2, an address the ISP knows how to reach.','The reserved range keeps DHCP away from the router, switches and printers. The pool tells clients their address, how to leave the subnet (gateway) and how to resolve names (DNS).','The PCs now have addresses and a gateway, and the request reaches the server. But the reply is addressed to 192.168.1.x, a private range the ISP will never route back.','The ACL is not a filter here: it only selects which source addresses get translated. inside and outside tell R1 which direction is which.','PAT rewrites each private source to R1\'s one public address and keeps the sessions apart by port number, so the whole office shares a single address.','The translation table is the proof: inside local addresses on the left, the shared inside global address on the right.'],

 why:['Know the normal path before you plan for failure. The S route with [1/0] is the primary; 1 is the default administrative distance of a static route.','Administrative distance is how believable a route source is: lower wins. Two static routes to the same network with different distances do not share; the higher one waits. That is why it is called floating.','Routing is needed in both directions. If only R1 fails over, requests reach the branch but replies still try the dead link.','Only the best route per network goes into the routing table. The floating route is stored in the config, ready, but invisible in show ip route until the primary goes away.','When G0/1 goes down, its connected subnet disappears, so the primary route\'s next hop is unreachable and the route is removed. The floating route is next in line and installs itself, on both routers.','When the primary link returns, its route with distance 1 beats distance 5 again and traffic moves back with nobody touching anything.'],

 build(){const n=mkNet([mkRouter('R1'),mkRouter('R2'),mkRouter('R3'),mkRouter('R4'),mkRouter('BR'),mkSwitch('SW1'),mkPC('PC1','192.168.50.10',24,'192.168.50.1')]);
